# A push to master runs the fast tier (tests without the race detector); a pull request runs the full tier (with it).
# Pushes to other branches run nothing, so the required checks of a pull request come from one run only.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make lint

  lint-arch:
    name: lint-arch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint-arch

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ${{ github.event_name == 'pull_request' && 'test-race' || 'test' }}

  generate:
    name: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make generate-check

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make licenses

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make vulncheck

  oasdiff:
    name: oasdiff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      # renovate: datasource=go depName=github.com/oasdiff/oasdiff
      OASDIFF_VERSION: v1.33.0
    # The report never blocks before 1.0 (ADR-0008): its steps continue on error, so a failure shows in the step and
    # the job stays green. A full checkout fetches every branch, so origin/<base branch> is present.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: oasdiff breaking
        id: diff
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          report="$RUNNER_TEMP/oasdiff.md"
          go run "github.com/oasdiff/oasdiff@$OASDIFF_VERSION" breaking \
            "origin/$BASE_REF:api/openapi.yaml" api/openapi.yaml --format markdown >"$report"
          if [ ! -s "$report" ]; then echo "No breaking changes." >"$report"; fi
          cat "$report" >>"$GITHUB_STEP_SUMMARY"
      # Pull requests from forks get a read-only token, so only those from this repository get the comment.
      - name: post or update the comment
        if: steps.diff.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- oasdiff-breaking -->"
        run: |
          comment="$RUNNER_TEMP/comment.md"
          { printf '%s\n\n' "$MARKER"; cat "$RUNNER_TEMP/oasdiff.md"; } >"$comment"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$comment" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$comment" --silent
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make build
      - run: ./bin/muster version
      - run: WEB_DIST_REQUIRED=1 go test ./web/... -run TestEmbeddedIndex -v

  # The end-to-end suite on muster dev; the nightly workflow runs it with two replicas.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make e2e

  helm-check:
    name: helm-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make helm-check

  # make compose-check, then PostgreSQL started from the example must report the example's settings and memory limit.
  compose-check:
    name: compose-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make compose-check
      - name: start PostgreSQL from the example
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.yml up -d --wait postgres
      - name: check the PostgreSQL settings and memory limit
        run: |
          failed=0
          compare() {
            if [ "$2" = "$3" ]; then echo "$1: $2"; else echo "$1 is '$2', the example sets '$3'"; failed=1; fi
          }
          for setting in shared_buffers=32MB work_mem=2MB max_connections=30; do
            name="${setting%%=*}"
            got=$(docker compose -f deploy/compose/docker-compose.yml exec -T postgres \
              psql -U muster -Atc "SHOW $name")
            compare "$name" "$got" "${setting#*=}"
          done
          id=$(docker compose -f deploy/compose/docker-compose.yml ps -q postgres)
          compare "memory limit" "$(docker inspect -f '{{.HostConfig.Memory}}' "$id")" 167772160
          exit "$failed"
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  # The release build in goreleaser's snapshot mode, without signatures: the binaries, the archives with their SBOMs,
  # and one image per architecture loaded into the local Docker. Both images print their version and commit, run as
  # distroless's nonroot user, and pass Trivy: a high or critical vulnerability that has a fix fails the job.
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.18.2
      # renovate: datasource=github-releases depName=anchore/syft
      SYFT_VERSION: v1.54.0
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: v0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Runs the arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
      - name: read the snapshot version
        run: echo "VERSION=$(jq -r .version dist/metadata.json)" >>"$GITHUB_ENV"
      - name: check the images
        run: |
          failed=0
          version_re=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          for arch in amd64 arm64; do
            img="ghcr.io/muster-io/muster:v${VERSION}-${arch}"
            out=$(docker run --rm --platform "linux/${arch}" "$img" version) || failed=1
            echo "$img version: $out"
            if ! printf '%s\n' "$out" | grep -Eq "^muster ${version_re} \(commit [0-9a-f]{12}\)$"; then
              echo "$img: want 'muster ${VERSION} (commit <12 hex digits>)'"; failed=1
            fi
            user=$(docker image inspect -f '{{.Config.User}}' "$img")
            entrypoint=$(docker image inspect -f '{{json .Config.Entrypoint}}' "$img")
            echo "$img user: $user, entry point: $entrypoint"
            if [ "$user" != "65532:65532" ]; then echo "$img: want the user 65532:65532"; failed=1; fi
            if [ "$entrypoint" != '["/usr/local/bin/muster"]' ]; then
              echo "$img: want the entry point [\"/usr/local/bin/muster\"]"; failed=1
            fi
          done
          exit "$failed"
      - name: install Trivy
        run: |
          v="${TRIVY_VERSION#v}"
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir" "$RUNNER_TEMP/bin"
          cd "$dir"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          curl -fsSLO "$base/trivy_${v}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/trivy_${v}_checksums.txt"
          sha256sum -c --ignore-missing "trivy_${v}_checksums.txt"
          tar -xzf "trivy_${v}_Linux-64bit.tar.gz" trivy
          mv trivy "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: scan the images
        run: |
          failed=0
          for arch in amd64 arm64; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "ghcr.io/muster-io/muster:v${VERSION}-${arch}" || failed=1
          done
          exit "$failed"
