# Copyright The Muster Authors

# A push to master runs the fast tier (tests without the race detector); a pull request runs the full tier (with it).
# Pushes to other branches run nothing, so the required checks of a pull request come from one run only.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make lint

  lint-arch:
    name: lint-arch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      - run: make lint-arch

  # The Go unit tests and the SPA's component tests, which run in Chromium.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install Playwright dependencies
        timeout-minutes: 9
        run: ./scripts/ci/install-playwright-deps.sh
      - run: make ${{ github.event_name == 'pull_request' && 'test-race' || 'test' }}

  # The integration tests on PostgreSQL 14 and 17, started by testcontainers on the runner's Docker.
  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pull Docker Hub images through the mirror
        run: ./scripts/ci/docker-hub-mirror.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-integration

  generate:
    name: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make generate-check

  # The generated pages are current, then the site builds strictly, so that a broken link or anchor fails. No path
  # filter: a new metric, setting or Internal alert changes generated pages without touching docs/.
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: make docs-check

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # make licenses reports the documentation toolchain, which it installs with this Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: make licenses

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make vulncheck

  oasdiff:
    name: oasdiff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      # renovate: datasource=go depName=github.com/oasdiff/oasdiff
      OASDIFF_VERSION: v1.33.0
    # The report on api/openapi.yaml never blocks before 1.0 (ADR-0008): its steps continue on error, so a failure
    # shows in the step and the job stays green. The Bridge protocol is published and frozen (ADR-0017): a breaking
    # change of api/bridge.yaml fails the job, with no override, because a breaking change takes a new major path.
    # The bridge serves the operations Muster calls, so its step compares in both directions: from the base to the
    # head as Muster the client sees the operations and as an existing bridge calls the push webhook (a removed
    # operation or answer field, a new required event member), and from the head to the base as an existing bridge
    # serves the operations (a new required answer field, a request field that becomes optional, a new request enum
    # value). In that direction a new operation looks removed; it is additive, since Muster calls it only when the
    # bridge's info declares it, so the two rules on removed operations are off there. --flatten-allof compares each
    # event as one schema: branch by branch, oasdiff reports a new required member of an event in the oneOf only as a
    # warning. What oasdiff cannot judge is left to the libraries' check of their copy of api/bridge.yaml and to
    # muster bridge check. The step runs last, so its failure skips neither the report nor its comment. A full
    # checkout fetches every branch, so origin/<base branch> is present.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: oasdiff breaking, api/openapi.yaml
        id: diff
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          report="$RUNNER_TEMP/oasdiff.md"
          go run "github.com/oasdiff/oasdiff@$OASDIFF_VERSION" breaking \
            "origin/$BASE_REF:api/openapi.yaml" api/openapi.yaml --format markdown >"$report"
          if [ ! -s "$report" ]; then echo "No breaking changes." >"$report"; fi
          { printf '%s\n\n' '# API (`api/openapi.yaml`), not blocking'; cat "$report"; } >>"$GITHUB_STEP_SUMMARY"
      # Pull requests from forks get a read-only token, so only those from this repository get the comment.
      - name: post or update the comment
        if: steps.diff.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- oasdiff-breaking -->"
        run: |
          comment="$RUNNER_TEMP/comment.md"
          { printf '%s\n\n' "$MARKER"; cat "$RUNNER_TEMP/oasdiff.md"; } >"$comment"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$comment" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$comment" --silent
          fi
      - name: oasdiff breaking, api/bridge.yaml
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF:api/bridge.yaml"
          levels="$RUNNER_TEMP/oasdiff-bridge-levels.txt"
          printf '%s\n' 'api-path-removed-without-deprecation NONE' 'api-removed-without-deprecation NONE' >"$levels"
          status=0
          compare() {
            title=$1
            shift
            report="$RUNNER_TEMP/oasdiff-bridge.md"
            rc=0
            go run "github.com/oasdiff/oasdiff@$OASDIFF_VERSION" breaking --fail-on ERR --flatten-allof "$@" \
              --format markdown >"$report" || rc=$?
            if [ ! -s "$report" ] && [ "$rc" -eq 0 ]; then echo "No breaking changes." >"$report"; fi
            if [ ! -s "$report" ]; then echo "oasdiff failed with exit status $rc; see the step log." >"$report"; fi
            { printf '%s\n\n' "$title"; cat "$report"; printf '\n'; } >>"$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then status=$rc; fi
          }
          compare '# Bridge protocol (`api/bridge.yaml`), Muster as the client' "$base" api/bridge.yaml
          compare '# Bridge protocol (`api/bridge.yaml`), existing bridges as the server' \
            --severity-levels "$levels" api/bridge.yaml "$base"
          exit "$status"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make build
      - run: ./bin/muster version
      - run: WEB_DIST_REQUIRED=1 go test ./web/... -run TestEmbeddedIndex -v

  # The end-to-end suites on muster dev against the development PostgreSQL, as two jobs side by side: the Go suite
  # (e2e-go) and the Playwright specs in Chromium (e2e-web). The job e2e, the required check, passes when both pass. The
  # nightly workflow runs the Go suite with two replicas.
  e2e-go:
    name: e2e-go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pull Docker Hub images through the mirror
        run: ./scripts/ci/docker-hub-mirror.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # make build builds the SPA that the binary embeds.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make e2e-go

  e2e-web:
    name: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pull Docker Hub images through the mirror
        run: ./scripts/ci/docker-hub-mirror.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install Playwright dependencies
        timeout-minutes: 9
        run: ./scripts/ci/install-playwright-deps.sh
      - run: make e2e-web

  # The required check of both suites: it fails when either job did not succeed, also when one was cancelled.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-go, e2e-web]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: both suites passed
        env:
          GO_RESULT: ${{ needs.e2e-go.result }}
          WEB_RESULT: ${{ needs.e2e-web.result }}
        run: |
          echo "e2e-go: $GO_RESULT, e2e-web: $WEB_RESULT"
          test "$GO_RESULT" = success && test "$WEB_RESULT" = success

  helm-check:
    name: helm-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/cache-go-tools
      # The chart's checks, then the unit tests of its alert rules with promtool.
      - run: make helm-check rules-test

  # make compose-check, then PostgreSQL started from the example must report the example's settings and memory limit.
  compose-check:
    name: compose-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pull Docker Hub images through the mirror
        run: ./scripts/ci/docker-hub-mirror.sh
      - run: make compose-check
      - name: start PostgreSQL from the example
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.yml up -d --wait postgres
      - name: check the PostgreSQL settings and memory limit
        run: |
          failed=0
          compare() {
            if [ "$2" = "$3" ]; then echo "$1: $2"; else echo "$1 is '$2', the example sets '$3'"; failed=1; fi
          }
          for setting in shared_buffers=32MB work_mem=2MB max_connections=30; do
            name="${setting%%=*}"
            got=$(docker compose -f deploy/compose/docker-compose.yml exec -T postgres \
              psql -U muster -Atc "SHOW $name")
            compare "$name" "$got" "${setting#*=}"
          done
          id=$(docker compose -f deploy/compose/docker-compose.yml ps -q postgres)
          compare "memory limit" "$(docker inspect -f '{{.HostConfig.Memory}}' "$id")" 167772160
          exit "$failed"
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  # The release build in goreleaser's snapshot mode, without signatures: the binaries, the archives with their SBOMs,
  # and one image per architecture loaded into the local Docker. Both images print their version and commit, run as
  # distroless's nonroot user, and pass Trivy: a high or critical vulnerability that has a fix fails the job.
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.18.3
      # renovate: datasource=github-releases depName=anchore/syft
      SYFT_VERSION: v1.54.1
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: v0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Runs the arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
      - name: read the snapshot version
        run: echo "VERSION=$(jq -r .version dist/metadata.json)" >>"$GITHUB_ENV"
      - name: check the images
        run: |
          failed=0
          version_re=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          for arch in amd64 arm64; do
            img="ghcr.io/muster-io/muster:v${VERSION}-${arch}"
            out=$(docker run --rm --platform "linux/${arch}" "$img" version) || failed=1
            echo "$img version: $out"
            if ! printf '%s\n' "$out" | grep -Eq "^muster ${version_re} \(commit [0-9a-f]{12}\)$"; then
              echo "$img: want 'muster ${VERSION} (commit <12 hex digits>)'"; failed=1
            fi
            user=$(docker image inspect -f '{{.Config.User}}' "$img")
            entrypoint=$(docker image inspect -f '{{json .Config.Entrypoint}}' "$img")
            echo "$img user: $user, entry point: $entrypoint"
            if [ "$user" != "65532:65532" ]; then echo "$img: want the user 65532:65532"; failed=1; fi
            if [ "$entrypoint" != '["/usr/local/bin/muster"]' ]; then
              echo "$img: want the entry point [\"/usr/local/bin/muster\"]"; failed=1
            fi
          done
          exit "$failed"
      - name: install Trivy
        run: |
          v="${TRIVY_VERSION#v}"
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir" "$RUNNER_TEMP/bin"
          cd "$dir"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          curl -fsSLO "$base/trivy_${v}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/trivy_${v}_checksums.txt"
          sha256sum -c --ignore-missing "trivy_${v}_checksums.txt"
          tar -xzf "trivy_${v}_Linux-64bit.tar.gz" trivy
          mv trivy "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: scan the images
        run: |
          failed=0
          for arch in amd64 arm64; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "ghcr.io/muster-io/muster:v${VERSION}-${arch}" || failed=1
          done
          exit "$failed"
