# Keeps the release pull request open, with the changelog from conventional commits. Merging it creates a draft
# release and its vX.Y.Z tag, which starts the release workflow. It runs with a GitHub App's token, because a tag
# pushed with GITHUB_TOKEN starts no workflow; the job is skipped until the variable RELEASE_PLEASE_APP_CLIENT_ID and
# the secret RELEASE_PLEASE_APP_PRIVATE_KEY are set.
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'muster-io/muster' && vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
