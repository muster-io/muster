name: Story proposal
description: A piece of work, described as a problem, a proposed capability and ideas for its acceptance.
labels: [story-proposal]
body:
  - type: markdown
    attributes:
      value: |
        Accepted proposals become story contracts in design/stories/ (see its README). Use the terms of CONTEXT.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
      description: The observable behaviour Muster should gain. Name the capability (C-NN) it extends, if any.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance ideas
      description: Statements that can be checked by a test or on the running binary once the work is done.
      placeholder: |
        - ...
    validations:
      required: true
