# Mutation testing with gremlins, run by `make mutation` over the core packages and published by the nightly workflow.
# The report informs and never blocks: the thresholds stay at 0, so a score never fails the run. The mutators are the
# gremlins defaults.
unleash:
  workers: 0 # one per CPU
  test-cpu: 0 # each test run may use every CPU
  # A mutant times out after this multiple of the coverage run's duration: about 150 s for a 1 s run with a warm build
  # cache. gremlins has no absolute timeout, and a low multiple times out healthy mutants.
  timeout-coefficient: 150
  integration: false
  exclude-files: # generated code, as regular expressions on the path relative to the package, e.g. dbgen/query.sql.go
    - '(^|/)dbgen/'
    - '(^|/)gen/'
    - '\.gen\.go$'
  threshold:
    efficacy: 0
    mutant-coverage: 0
