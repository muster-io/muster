# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
# The accepted warnings and their reasons are in api/README.md (Spike result); keep the two lists in step.
api/openapi.yaml:
  operation-2xx-response:
    - '#/paths/~1sessions~1oidc~1start/get/responses'
    - '#/paths/~1sessions~1oidc~1callback/get/responses'
    - '#/paths/~1me~1oidc-identity~1callback/get/responses'
  operation-4xx-response:
    - '#/paths/~1callbacks~1mattermost~1{connection_id}/post/responses'
    - '#/paths/~1openapi.yaml/get/responses'
    - '#/paths/~1health~1live/get/responses'
    - '#/paths/~1health~1ready/get/responses'
    - '#/paths/~1metrics/get/responses'
  no-unused-components:
    - '#/components/schemas/AlertmanagerWebhook'
