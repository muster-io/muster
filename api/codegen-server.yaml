# oapi-codegen: the strict server for the standard library's ServeMux, with its models (make generate).
# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: gen
output: internal/api/gen/server.gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
output-options:
  skip-prune: true # schemas reachable only from `webhooks` would be dropped otherwise
  nullable-type: true # tells an omitted optional field from an explicit null
  exclude-tags: # hand-written handlers; Outgoing webhooks are requests Muster sends
    - Outgoing webhooks
    - Health and metrics
