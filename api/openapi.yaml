        policy:
          $ref: '#/components/schemas/RoutePolicy'
    PublicId:
      type: string
      pattern: ^[A-HJKMNP-TV-Za-hjkmnp-tv-z]{1,2}[0-9A-TV-Za-tv-z]{12}$
      example: AGK7M3QX9P2RTA
      description: 'Opaque public identifier (`public_id`): a type prefix of one or two letters followed by 12 random
        characters of Crockford base32 (`0`–`9` and `A`–`Z` without `I`, `L`, `O` and `U`; 60 bits), such as
        `AGK7M3QX9P2RTA` for an Alert Group. Prefixes use the same letters and differ per type: `AG` Alert Group, `AE` Audit
        log entry, `AK` Account link, `AR` Account link request, `CN` Connection, `DE` delivery event, `DS` Destination,
        `KR` Link rule, `NE` Note, `NK` Integration token, `NT` Integration, `PT` Personal access token, `RG` Organization,
        `RT` Route, `SA` Service account, `SN` session, `SR` User, `SS` Stored Snapshot, `ST` Service account token, `TB`
        Lookup table, `TE` Timeline entry. Responses always carry the canonical upper-case form. Input is case-insensitive
        and normalized before lookup — `O` reads as `0`, `I` and `L` as `1` — so the pattern also admits lower case and
        those letters. People refer to Alert Groups by `#N`, never by `public_id`.'
    NullablePublicId:
      type:
      - string
      - 'null'
      pattern: ^[A-HJKMNP-TV-Za-hjkmnp-tv-z]{1,2}[0-9A-TV-Za-tv-z]{12}$
      example: AGK7M3QX9P2RTA
      description: A `public_id` in the format of `PublicId`, or null.
    TemplateErrorState:
      type: object
      required:
      - since
      - error
      - fallback
      properties:
        since:
          type: string
          format: date-time
        error:
          type: string
        fallback:
          type: string
          enum:
          - fallback_template
          - not_sent
          description: '`fallback_template` for messenger templates, `not_sent` for outgoing webhook requests.'
    Route:
      allOf:
      - $ref: '#/components/schemas/RouteInput'
      - type: object
        required:
        - id
        - position
        - is_default
        - destinations
        - storm_active
        - open_alert_group_count
        - created_at
        - etag
        properties:
          id:
            $ref: '#/components/schemas/PublicId'
          position:
            type: integer
            description: Zero-based position in evaluation order; the Default route is last.
          is_default:
            type: boolean
          destinations:
            type: array
            description: The Route's Destinations with their health, for the Broken warning.
            items:
              $ref: '#/components/schemas/DestinationRef'
          template_error:
            description: Set while a template of the Route keeps failing.
            $ref: '#/components/schemas/TemplateErrorState'
          storm_active:
            type: boolean
          storm:
            description: Set while the Route's Storm is active (`storm_active`), for the Storm banner.
            $ref: '#/components/schemas/RouteStorm'
          open_alert_group_count:
            type: integer
          created_at:
            type: string
            format: date-time
          etag:
            type: string
            readOnly: true
            description: The same value as the `ETag` header; send it as `If-Match` on the next update. Lets a client update
              an item of a list without reading it again.
    RouteStorm:
      type: object
      required:
      - since
      - alert_group_count
      properties:
        since:
          type: string
          format: date-time
          description: When the Storm started.
        alert_group_count:
          type: integer
          description: New Alert Groups of the Route since the Storm started — the count of its Storm summary.
    RouteList:
      type: object
      description: All Routes in evaluation order, the Default route last. The list ETag covers the order.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Route'
    RouteOrder:
      type: object
      required:
      - route_ids
      properties:
        route_ids:
          type: array
          description: Every Route except the Default route, in the new order.
          items:
            $ref: '#/components/schemas/PublicId'
    RouteProfile:
      type: object
      description: A starting set of Route settings. Profiles only pre-fill the create form and are not stored.
      required:
      - id
      - name
      - urgent
      - group_key
      - policy
      properties:
        id:
          type: string
          enum:
          - on_call
          - informational
        name:
          type: string
        urgent:
          type: boolean
        group_key:
          type: array
          items:
            type: string
        policy:
          $ref: '#/components/schemas/RoutePolicy'
    RouteProfileList:
      type: object
