      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RouteProfile'
    RouteSuggestionId:
      type: string
      description: '`heartbeat_lost` suggests a Route for `alertname="MusterHeartbeatLost"`; `internal_alerts` suggests a
        Route for `alertname=~"Muster.*"`.'
      enum:
      - heartbeat_lost
      - internal_alerts
    RouteSuggestion:
      type: object
      required:
      - id
      - route
      properties:
        id:
          $ref: '#/components/schemas/RouteSuggestionId'
        route:
          description: The Route that accepting would create at the top of the list.
          $ref: '#/components/schemas/RouteInput'
    RouteSuggestionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RouteSuggestion'
    RouteSuggestionAcceptance:
      type: object
      properties:
        destination_ids:
          type: array
          description: Destinations for the created Route; required for `internal-alerts`.
          items:
            $ref: '#/components/schemas/PublicId'
    GroupKeyPreviewRequest:
      type: object
      required:
      - proposed_group_key
      properties:
        route_id:
          description: A saved Route; its current Group key is the "current" side.
          $ref: '#/components/schemas/NullablePublicId'
        proposed_group_key:
          type: array
          items:
            type: string
        period_seconds:
          type: integer
          minimum: 1
          description: Defaults to `routing.group_key_preview_period`; at most `retention.stored_snapshots`.
        matchers:
          type: array
          description: Matchers to preview instead of, or without, a saved Route's own.
          items:
            $ref: '#/components/schemas/Matcher'
      description: Preview of a Group key. Give `route_id` for a saved Route, `matchers` for a Route that is not saved yet
        (the create form), or both to try other Matchers on a saved Route; at least one of the two is required (`422`).
    GroupKeyPreviewExample:
      type: object
      required:
      - group_key_values
      - alert_count
      properties:
        group_key_values:
          $ref: '#/components/schemas/Labels'
        alert_count:
          type: integer
    GroupKeyPreviewSide:
      type: object
      required:
      - alert_group_count
      - examples
      properties:
        alert_group_count:
          type: integer
        examples:
          type: array
          description: The `routing.group_key_preview_examples` largest Alert Groups.
          items:
            $ref: '#/components/schemas/GroupKeyPreviewExample'
    GroupKeyPreview:
      type: object
      description: Covers the Alerts reported firing in the Stored Snapshots of the period that the Route would take at its
        place in the current evaluation order (Matchers without a saved Route stand for a new Route just before the Default
        route), each Alert once with its Integration's Static labels, read from the newest Snapshot back and at most
        `routing.group_key_preview_max_alerts` of them.
      required:
      - period_seconds
      - truncated
      - proposed
      properties:
        period_seconds:
          type: integer
        truncated:
          type: boolean
          description: True when `routing.group_key_preview_max_alerts` stopped the reading before the start of the period,
            so the counts cover only its most recent part.
        current:
          $ref: '#/components/schemas/GroupKeyPreviewSide'
          description: Absent when no saved Route was given.
        proposed:
          $ref: '#/components/schemas/GroupKeyPreviewSide'
    MovedAlertGroups:
      type: object
      required:
      - moved
      properties:
        moved:
          type: integer
          description: Open Alert Groups moved to the Default route.
    UserRef:
      type: object
      required:
      - id
      - name
      - deactivated
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
        login:
          type: string
        deactivated:
          type: boolean
          description: The user was deleted; the UI shows "(deactivated)".
      description: 'A User. Used wherever the person must be a User: the Owner and the previous Owner.'
    ActorRef:
      type: object
      description: 'Who resolved an Alert Group or wrote a Note: a User or a Service account. An Owner is always a User (`UserRef`),
        because a Service account cannot become an Owner.'
      required:
      - kind
      - id
      - name
      - deactivated
      properties:
        kind:
          type: string
          enum:
          - user
          - service_account
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
        login:
          type: string
          description: Users only.
        deactivated:
          type: boolean
          description: The user or Service account was deleted; the UI shows "(deactivated)".
    CommandName:
      type: string
      enum:
      - acknowledge
      - unacknowledge
      - resolve
      - unresolve
      - snooze
      - unsnooze
      - still_on_it
      - add_note
      description: The Commands a caller may run on an Alert Group now (`allowed_commands`). `still_on_it` appears while a
        Reminder is pending and the caller is the Owner; `add_note` while the caller holds `alert-groups:note`. A Service
        account is never offered `acknowledge` or `still_on_it`.
    ResolvedBy:
      type: object
      required:
      - by
      properties:
        by:
          $ref: '#/components/schemas/ResolverKind'
        actor:
          description: 'Set when `by` is `user`: the User or Service account that resolved it.'
          $ref: '#/components/schemas/ActorRef'
        reason:
          type:
          - string
          - 'null'
          description: Reason text when the system resolved it.
        reason_code:
          $ref: '#/components/schemas/NullableResolveReason'
    NextNotice:
      type: object
      required:
      - kind
      - at
      properties:
        kind:
          type: string
          enum:
          - ack_timeout
          - reminder
        at:
          type: string
          format: date-time
    AlertGroupNotice:
      type: object
      description: A banner for the Alert Group page; the UI owns the wording.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - alerts_still_firing
          - replacement
          - details_removed
          - firing_again_after_manual_resolve
        count:
          type:
          - integer
          - 'null'
        label:
          type:
          - string
          - 'null'
          description: The Instance label that changed, for `replacement`.
        retention_days:
          type:
          - integer
          - 'null'
        resolved_number:
          type:
          - integer
          - 'null'
          description: The `#N` of the manually resolved Alert Group, for `firing_again_after_manual_resolve`.
    AlertGroupLink:
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
    AlertGroup:
      type: object
      required:
      - id
      - number
      - title
      - status
      - severity_level
      - urgent
      - route
      - integrations
      - started_at
      - last_changed_at
      - reopen_count
      - firing_alert_count
      - resolved_alert_count
      - unclaimed
      - delivery_problem
      - allowed_commands
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        number:
          type: integer
          description: The `#N`, assigned per Organization without gaps.
        title:
          type: string
        summary:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/AlertGroupStatus'
        owner:
          description: 'Set while acknowledged. Always a User: a Service account cannot become an Owner; a Personal access
            token acts as its User.'
          $ref: '#/components/schemas/UserRef'
        snooze_until:
          type:
          - string
          - 'null'
          format: date-time
          description: Null while snoozed means no end.
        snoozed_by:
          description: 'Set while snoozed: who set the current Snooze, a User or a Service account ("Snoozed by" in the Root
            message). Stored on the Alert Group by Snooze, restored with the Snooze by a Reopen into snoozed, and cleared
            when the Snooze ends.'
          readOnly: true
          $ref: '#/components/schemas/ActorRef'
        severity_level:
          $ref: '#/components/schemas/SeverityLevel'
        urgent:
          type: boolean
        route:
          $ref: '#/components/schemas/EntityRef'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
        started_at:
          type: string
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        last_changed_at:
          type: string
          format: date-time
        reopen_count:
          type: integer
        firing_alert_count:
          type: integer
        resolved_alert_count:
          type: integer
        resolution:
          description: Set when resolved.
          $ref: '#/components/schemas/ResolvedBy'
        unclaimed:
          type: boolean
        next_notice:
          description: The next scheduled ack timeout notice or Reminder.
          $ref: '#/components/schemas/NextNotice'
        delivery_problem:
          type: boolean
          description: Any Destination is Not delivered, waiting for a Broken Destination, deleted in the messenger or has
            a Thread not attached.
        details_removed:
          type: boolean
          description: Alerts and Timeline were removed by retention; only the summary row and its Notes remain.
        group_labels:
          $ref: '#/components/schemas/Labels'
        common_labels:
          $ref: '#/components/schemas/Labels'
        common_annotations:
          $ref: '#/components/schemas/Labels'
        label_values:
          description: Values of the labels requested with `label_columns`, when all Alerts share them.
          $ref: '#/components/schemas/Labels'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/AlertGroupNotice'
        links:
          type: array
          items:
            $ref: '#/components/schemas/AlertGroupLink'
        allowed_commands:
          type: array
          description: Commands the current status allows for the caller's Permissions and identity; Acknowledge on another
            user's Alert Group is a Takeover. A Service account is not offered `acknowledge` or `still_on_it`.
          items:
            $ref: '#/components/schemas/CommandName'
    AlertGroupList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertGroup'
        next_cursor:
          type:
          - string
          - 'null'
    AlertGroupCounts:
      type: object
      description: Alert Groups matching the other filters, per status tab. The default tab Open is the sum of `firing`,
        `acknowledged` and `snoozed`.
      required:
      - firing
      - acknowledged
      - snoozed
      - resolved
      - all
      properties:
        firing:
          type: integer
        acknowledged:
          type: integer
        snoozed:
          type: integer
        resolved:
          type: integer
        all:
          type: integer
    AlertGroupAlert:
      type: object
      required:
      - fingerprint
      - labels
      - state
      - starts_at
      - last_seen_at
      - alertmanager_groups
      properties:
        fingerprint:
          type: string
        integration:
          $ref: '#/components/schemas/EntityRef'
        labels:
          $ref: '#/components/schemas/Labels'
        annotations:
          $ref: '#/components/schemas/Labels'
        state:
          $ref: '#/components/schemas/AlertState'
        resolve_reason:
          $ref: '#/components/schemas/NullableResolveReason'
        resolve_reason_text:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        alertmanager_groups:
          type: array
          items:
            type: string
        source_url:
          type:
          - string
          - 'null'
          description: The Alert's `generatorURL`.
    AlertGroupAlertList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertGroupAlert'
        next_cursor:
          type:
          - string
          - 'null'
    RelatedAlertGroup:
      type: object
      required:
      - id
      - number
      - status
      - started_at
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        number:
          type: integer
        status:
          $ref: '#/components/schemas/AlertGroupStatus'
        started_at:
          type: string
          format: date-time
        duration_seconds:
          type:
          - integer
          - 'null'
        resolution:
          $ref: '#/components/schemas/ResolvedBy'
    RelatedAlertGroupList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RelatedAlertGroup'
        next_cursor:
          type:
          - string
          - 'null'
    DurationStats:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
        median_seconds:
          type:
          - integer
          - 'null'
        p95_seconds:
          type:
          - integer
          - 'null'
    StatisticsDay:
      type: object
      required:
      - date
      - alert_group_count
      - time_to_acknowledge
      - time_to_resolve
      properties:
        date:
          type: string
          format: date
        alert_group_count:
          type: integer
        time_to_acknowledge:
          description: From the start of each Alert Group to its first acknowledgement; see `AlertGroupStatisticsItem`.
          $ref: '#/components/schemas/DurationStats'
        time_to_resolve:
          $ref: '#/components/schemas/DurationStats'
    AlertGroupStatistics:
      type: object
      required:
      - group_by
      - from
      - to
      - items
      properties:
        group_by:
          type: string
          enum:
          - route
          - integration
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertGroupStatisticsItem'
    AlertGroupStatisticsItem:
      type: object
      required:
      - subject
      - alert_group_count
      - time_to_acknowledge
      - time_to_resolve
      - per_day
      properties:
        subject:
          $ref: '#/components/schemas/EntityRef'
        alert_group_count:
          type: integer
        time_to_acknowledge:
          description: From the start of each Alert Group to its first acknowledgement. Takeover, Unacknowledge and Reopen
            do not change it; Alert Groups resolved without ever being acknowledged are left out, so `count` may be lower
            than `alert_group_count`.
          $ref: '#/components/schemas/DurationStats'
        time_to_resolve:
          $ref: '#/components/schemas/DurationStats'
        per_day:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsDay'
    LifecycleEvent:
      type: string
      description: |
        Lifecycle event names, exactly as in the lifecycle event tables (every row is one Timeline entry with the row's kind, loudness and Mentions).
        The Timeline kind of each event is given in `x-event-kinds`.
      enum:
      - created
      - alerts_added
      - alert_replaced
      - alert_resolved
      - alert_continued
      - annotations_changed
      - severity_raised
      - urgency_raised
      - reopened
      - snooze_ended
      - resolved
      - moved_to_default_route
      - acknowledged
      - takeover
      - unacknowledged
      - unresolved
      - snoozed
      - unsnoozed
      - note_added
      - ack_timeout
      - unclaimed
      - reminder
      - reminder_answered
      - auto_unacknowledged
      - notices_missed
      x-event-kinds:
        status:
        - created
        - urgency_raised
        - reopened
        - snooze_ended
        - resolved
        - acknowledged
        - takeover
        - unacknowledged
        - unresolved
        - snoozed
        - unsnoozed
        - auto_unacknowledged
        alerts:
        - alerts_added
        - alert_replaced
        - alert_resolved
        - alert_continued
        - annotations_changed
        - severity_raised
        notes:
        - note_added
        timers:
        - ack_timeout
        - unclaimed
        - reminder
        - reminder_answered
        - notices_missed
        system:
        - moved_to_default_route
    Loudness:
      type: string
      enum:
      - loud
      - quiet
    MentionName:
      type: string
      description: A symbolic Mention that each Destination turns into real Mentions.
      enum:
      - owner
      - previous_owner
      - new_alert_group
      - new_alerts
      - reopen
      - ack_timeout
      - snooze_ended
      - rise_to_urgent
    TimelineKind:
      type: string
      enum:
      - status
      - alerts
      - notes
      - timers
      - delivery
      - system
    TimelineActor:
      type: object
      description: Who caused the entry. `system` entries carry the reason in `reason`.
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/ActorKind'
        id:
          $ref: '#/components/schemas/NullablePublicId'
        name:
          type:
          - string
          - 'null'
        token_name:
          type:
          - string
          - 'null'
        transport:
          $ref: '#/components/schemas/Transport'
        reason:
          type:
          - string
          - 'null'
          description: Reason of an automatic transition, for example `owner_disabled` or `owner_deleted` when disabling
            or deleting a user released their acknowledgement.
    ActorKind:
      type: string
      enum:
      - user
      - service_account
      - system
    TimelineEntryBase:
      type: object
      required:
      - id
      - at
      - kind
      - actor
      properties:
        id:
          description: '`TE` for lifecycle and system entries, `NE` for a Note (the same id as its `note`), `DE` for a delivery
            event.'
          $ref: '#/components/schemas/PublicId'
        at:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/TimelineKind'
        actor:
          $ref: '#/components/schemas/TimelineActor'
    TimelineLifecycleFields:
      type: object
      required:
      - event
      - loudness
      - mentions
      properties:
        event:
          $ref: '#/components/schemas/LifecycleEvent'
        loudness:
          $ref: '#/components/schemas/Loudness'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/MentionName'
    TimelineStatusEntry:
      allOf:
      - $ref: '#/components/schemas/TimelineEntryBase'
      - $ref: '#/components/schemas/TimelineLifecycleFields'
      - type: object
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - status
          from_status:
            $ref: '#/components/schemas/NullableAlertGroupStatus'
          to_status:
            $ref: '#/components/schemas/AlertGroupStatus'
          reason:
            type:
            - string
            - 'null'
            description: Reason of an automatic status change.
          owner:
            description: The Owner after the entry, if any.
            $ref: '#/components/schemas/UserRef'
          previous_owner:
            description: The Owner who lost the Alert Group (Takeover, urgency rise, auto-unacknowledge, an Owner disabled
              or deleted).
            $ref: '#/components/schemas/UserRef'
          snooze_until:
            type:
            - string
            - 'null'
            format: date-time
    TimelineAlertsEntry:
      allOf:
      - $ref: '#/components/schemas/TimelineEntryBase'
      - $ref: '#/components/schemas/TimelineLifecycleFields'
      - type: object
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - alerts
          fingerprints:
            type: array
            items:
              type: string
          replaced_label:
            type:
            - string
            - 'null'
            description: The Instance label that differs, for `alert_replaced`.
          reason:
            type:
            - string
            - 'null'
          label_conflicts:
            type: array
            description: Static labels the added Alerts already carried.
            items:
              type: string
    TimelineNoteEntry:
      allOf:
      - $ref: '#/components/schemas/TimelineEntryBase'
      - $ref: '#/components/schemas/TimelineLifecycleFields'
      - type: object
        required:
        - kind
        - note
        properties:
          kind:
            type: string
            enum:
            - notes
          note:
            $ref: '#/components/schemas/Note'
    TimelineTimersEntry:
      allOf:
      - $ref: '#/components/schemas/TimelineEntryBase'
      - $ref: '#/components/schemas/TimelineLifecycleFields'
      - type: object
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - timers
          notice_number:
            type:
            - integer
            - 'null'
          missed_count:
            type:
            - integer
            - 'null'
            description: For `notices_missed`.
    DeliveryEventKind:
      type: string
      description: Delivery events are not lifecycle events and reach neither messengers nor outgoing webhook events.
      enum:
      - publication
      - possible_duplicate
      - not_delivered
      - delivered_late
      - deleted_in_messenger
      - republished
      - thread_not_attached
      - markup_rejected
      - destination_broken
      - destination_recovered
      - storm_summary
      - final_edit
    TimelineDeliveryEntry:
      allOf:
      - $ref: '#/components/schemas/TimelineEntryBase'
      - type: object
        required:
        - kind
        - delivery_event
        - destination
        - loudness
        - mentions
        properties:
          kind:
            type: string
            enum:
            - delivery
          delivery_event:
            $ref: '#/components/schemas/DeliveryEventKind'
          destination:
            $ref: '#/components/schemas/EntityRef'
          error:
            type:
            - string
            - 'null'
            description: 'Provider error text. Secrets, the Signing secret and tokens are masked. Untrusted: render as plain
              text.'
          loudness:
            $ref: '#/components/schemas/Loudness'
          mentions:
            type: array
            description: Mentions the delivery event carried (see the Loud and Quiet table of delivery events).
            items:
              $ref: '#/components/schemas/MentionName'
    TimelineSystemEntry:
      allOf:
      - $ref: '#/components/schemas/TimelineEntryBase'
      - type: object
        required:
        - kind
        - system_event
        properties:
          kind:
            type: string
            enum:
            - system
          system_event:
            type: string
            enum:
            - moved_to_default_route
            - muster_unavailable
            - fallback_template_used
            - template_value_missing
          event:
            description: Set for lifecycle events of kind `system`.
            $ref: '#/components/schemas/LifecycleEvent'
          loudness:
            $ref: '#/components/schemas/Loudness'
          mentions:
            type: array
            items:
              $ref: '#/components/schemas/MentionName'
          period_from:
            type:
            - string
            - 'null'
            format: date-time
          period_to:
            type:
            - string
            - 'null'
            format: date-time
          detail:
            type:
            - string
            - 'null'
    TimelineEntry:
      description: One Timeline entry; `kind` selects the variant.
      oneOf:
      - $ref: '#/components/schemas/TimelineStatusEntry'
      - $ref: '#/components/schemas/TimelineAlertsEntry'
      - $ref: '#/components/schemas/TimelineNoteEntry'
      - $ref: '#/components/schemas/TimelineTimersEntry'
      - $ref: '#/components/schemas/TimelineDeliveryEntry'
      - $ref: '#/components/schemas/TimelineSystemEntry'
      discriminator:
        propertyName: kind
        mapping:
          status: '#/components/schemas/TimelineStatusEntry'
          alerts: '#/components/schemas/TimelineAlertsEntry'
          notes: '#/components/schemas/TimelineNoteEntry'
          timers: '#/components/schemas/TimelineTimersEntry'
          delivery: '#/components/schemas/TimelineDeliveryEntry'
          system: '#/components/schemas/TimelineSystemEntry'
    TimelineEntryList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        next_cursor:
          type:
          - string
          - 'null'
    Note:
      type: object
      required:
      - id
      - body
      - author
      - transport
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        body:
          type: string
        author:
          $ref: '#/components/schemas/ActorRef'
        transport:
          $ref: '#/components/schemas/Transport'
        created_at:
          type: string
          format: date-time
    NoteList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        next_cursor:
          type:
          - string
          - 'null'
    NoteInput:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: At most `alert_group.note_max_length` characters.
    ResolveRequest:
      type: object
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 4000
          description: Optional Note recorded in the same request.
    SnoozeRequest:
      type: object
      description: Exactly one of `until` and `no_end`; neither, both or a past `until` is `422`. A Snooze with no end is
        chosen explicitly, never by leaving a field out. The UI shows a warning before sending `no_end`.
      minProperties: 1
      maxProperties: 1
      properties:
        until:
          type: string
          format: date-time
          description: A future time.
        no_end:
          type: boolean
          enum:
          - true
          description: Snooze until someone unsnoozes it.
    CommandOutcome:
      type: string
      description: '`unchanged` for an idempotent repeat, such as Acknowledge by the current Owner.'
      enum:
      - done
      - unchanged
    CommandResult:
      type: object
      required:
      - outcome
      - alert_group
      properties:
        outcome:
          $ref: '#/components/schemas/CommandOutcome'
        alert_group:
          $ref: '#/components/schemas/AlertGroup'
    BulkCommandRequest:
      type: object
      required:
      - command
      - alert_group_ids
      properties:
        command:
          type: string
          enum:
          - acknowledge
          - resolve
          - snooze
          - unsnooze
        alert_group_ids:
          type: array
          minItems: 1
          maxItems: 100
          description: At most `alert_group.bulk_max`.
          items:
            $ref: '#/components/schemas/PublicId'
        note:
          type: string
          maxLength: 4000
          description: For `resolve`; optional.
        snooze:
          description: Required for `snooze`.
          $ref: '#/components/schemas/SnoozeRequest'
      description: 'A Command on up to `alert_group.bulk_max` Alert Groups. Arguments belong to their command: `snooze` for
        `snooze`, `note` for `resolve`; others are ignored.'
    BulkOutcome:
      type: string
      enum:
      - done
      - unchanged
      - refused
      - skipped
      - failed
    BulkCommandItem:
      type: object
      required:
      - alert_group_id
      - outcome
      properties:
        alert_group_id:
          $ref: '#/components/schemas/PublicId'
        number:
          type:
          - integer
          - 'null'
        outcome:
          $ref: '#/components/schemas/BulkOutcome'
        code:
          type:
          - string
          - 'null'
          description: 'Stable code of a result other than `done` and `unchanged`: with `refused`, a `command-refused` code such
            as `already_resolved` or `owner_must_be_user` (Acknowledge by a Service account); with `skipped`, `owned_by_other`
            for an Acknowledge skipped because another user owns the Alert Group; with `failed`, `not_found` for an id that
            names no Alert Group the caller may see.'
        message:
          type:
          - string
          - 'null'
          description: 'For example "skipped: owned by Alice".'
    BulkCommandResult:
      type: object
      description: One outcome per Alert Group; a refusal never stops the others.
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkCommandItem'
    DeliveryState:
      type: string
      description: '`waiting_for_broken_destination` — derived, never stored: a `pending` delivery whose Destination is
        Broken; `withheld` — never posted to this Destination: the Alert Group resolved while a Storm summary stood for it
        or while the Destination was Broken; `retired` — no longer updated there after its final edit, because the
        Destination left the Route or was deleted.'
      enum:
      - pending
      - delivered
      - waiting_for_broken_destination
      - not_delivered
      - deleted_in_messenger
      - withheld
      - retired
    AlertGroupDelivery:
      type: object
      required:
      - destination
      - state
      - thread_not_attached
      - possible_duplicate
      properties:
        destination:
          $ref: '#/components/schemas/DestinationRef'
        state:
          $ref: '#/components/schemas/DeliveryState'
        thread_not_attached:
          type: boolean
        possible_duplicate:
          type: boolean
        message_url:
          type:
          - string
          - 'null'
          format: uri
          description: Link to the Root message where the messenger provides one.
        error:
          type:
          - string
          - 'null'
          description: 'Provider error text of Not delivered. Secrets, the Signing secret and tokens are masked. Untrusted:
            render as plain text.'
        updated_at:
          type: string
          format: date-time
    AlertGroupDeliveryList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertGroupDelivery'
    HintEvent:
      type: object
      required:
      - type
      - id
      description: |-
        Data of a server-sent event named `hint`, delivered on `GET /live-updates`.

        | `type` | `id` | Meaning |
        |---|---|---|
        | `alert-group` | the Alert Group `public_id` | It changed (status, Alerts, Timeline, delivery state): refresh its page and any list row. |
        | `alert-groups` | null | New Alert Groups may match the current list filters or counts: the UI announces "N new". |
        | `integration`, `route`, `connection`, `destination` | the resource `public_id`, or null for the whole collection | A configuration resource changed. |
        | `organization` | null | Organization settings changed. |
        | `system-notices`, `system-status` | null | The Organization-wide notices, or the System status, changed. |
        | `account-links` | null | An Account link of the signed-in user appeared or disappeared. |
      properties:
        type:
          type: string
          enum:
          - alert-group
          - alert-groups
          - integration
          - route
          - connection
          - destination
          - organization
          - system-notices
          - system-status
          - account-links
        id:
          $ref: '#/components/schemas/NullablePublicId'
      example:
        type: alert-group
        id: AGK7M3QX9P2RTA
    ConnectionType:
      type: string
      enum:
      - mattermost
      - telegram
    MattermostConnectionBase:
      type: object
      required:
      - type
      - name
      - server_url
      - limiter
      properties:
        type:
          type: string
          enum:
          - mattermost
