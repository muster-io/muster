components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: muster_session
      description: Browser session in an `HttpOnly; Secure; SameSite=Lax` cookie. Mutating requests also need `csrf`. Ends
        after `auth.session_idle_timeout` idle or `auth.session_lifetime` in total. See `SessionState` for limited sessions.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from the session (`Session.csrf_token`), required on every mutating request made with the session
        cookie; a missing or wrong token gets `403`. Not needed with bearer tokens.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: mstr_<kind>_
      description: Personal access token (`mstr_pat_`; acts as its owner, with Permissions narrowed to the chosen ones, and
        so may become an Owner of Alert Groups; for an owner who signs in through OIDC it gets `401` with
        `oidc_recheck_required` after the IdP refused the owner, until the owner's next OIDC sign-in, and — only when the
        IdP granted no offline token — once the owner's last OIDC sign-in is older than `auth.oidc_token_grace`) or Service account token (`mstr_sat_`; acts with the Service account's Role
        and can never become an Owner). Rate-limited per token (`api.rate_limit`). Integration tokens (`mstr_int_`) are not
        accepted here. Operations that change the caller's own account need the web session instead.
    integrationToken:
      type: http
      scheme: bearer
      description: 'Integration token (`mstr_int_`). Accepted only by the ingestion and Heartbeat endpoints, as `Authorization:
        Bearer`, or in the path where the operation says so. API tokens are not accepted there.'
    telegramSecretToken:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Secret token that Muster registered with the Telegram webhook.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor` of the previous page. Offsets are not supported.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size (`api.page_size`).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the representation being replaced, as returned by the last read. A mismatch gets `412`; a missing
        header gets `428`.
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Optional ETag; when present and stale, the request gets `412`.
      schema:
        type: string
    From:
      name: from
      in: query
      description: Start of the time range (RFC 3339, UTC).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: End of the time range (RFC 3339, UTC).
      schema:
        type: string
        format: date-time
    LabelMatchers:
      name: label
      in: query
      description: 'Label filter: one Alertmanager-syntax Matcher per repeat of the parameter, combined with AND. Each value
        is a whole matcher: `label=namespace%3D%22payments%22&label=pod%3D~%22api-.*%22` means `namespace="payments"` and
        `pod=~"api-.*"`. There is no per-label shorthand. On Alert Groups the Matchers are matched against the common labels
        — the labels every Alert of the group has with the same value — so the filter also works on summary rows after
        the Alerts were removed; a label the Alerts do not share counts as absent. On the Alerts view of an Integration
        they are matched against each Alert''s labels.'
      schema:
        type: array
        items:
          type: string
      examples:
        one_matcher:
          summary: One Matcher
          value:
          - namespace="payments"
        two_matchers:
          summary: Two Matchers, combined with AND
          value:
          - namespace="payments"
          - pod=~"api-.*"
    AgStatus:
      name: status
      in: query
      description: 'Only these statuses. Default: firing, acknowledged and snoozed.'
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AlertGroupStatus'
    AgRoute:
      name: route
      in: query
      description: Only these Routes (`public_id`).
      schema:
        type: array
        items:
          type: string
    AgIntegration:
      name: integration
      in: query
      description: Only Alert Groups with Alerts from these Integrations (`public_id`).
      schema:
        type: array
        items:
          type: string
    AgSeverity:
      name: severity
      in: query
      description: Only these Severity levels.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SeverityLevel'
    AgUrgent:
      name: urgent
      in: query
      description: Only Urgent (true) or non-Urgent (false) Alert Groups.
      schema:
        type: boolean
    AgResolvedBy:
      name: resolved_by
      in: query
      description: Only Alert Groups resolved by a person or by the system.
      schema:
        $ref: '#/components/schemas/ResolverKind'
    AgResolveReason:
      name: resolve_reason
      in: query
      description: 'With `resolved_by=system`: the reason.'
      schema:
        $ref: '#/components/schemas/ResolveReason'
    AgReopened:
      name: reopened
      in: query
      description: 'True: Reopen count above zero.'
      schema:
        type: boolean
    AgOwner:
      name: owner
      in: query
      description: A user `public_id`, `me` (the calling User; `422` for a Service account token), or `none` for Alert Groups
        nobody owns.
      schema:
        type: string
    AgSnoozedNoEnd:
      name: snoozed_no_end
      in: query
      description: Only Alert Groups snoozed with no end.
      schema:
        type: boolean
    AgDeliveryProblem:
      name: delivery_problem
      in: query
      description: Any Destination is Not delivered, waiting for a Broken Destination, deleted in the messenger or has a Thread
        not attached.
      schema:
        type: boolean
    AgUnclaimed:
      name: unclaimed
      in: query
      description: Only Unclaimed Alert Groups.
      schema:
        type: boolean
    AgNumber:
      name: number
      in: query
      description: 'The Alert Group with exactly this `#N`. The default time range does not apply: a number is found whatever
        its age (while its summary row is kept).'
      schema:
        type: integer
        minimum: 1
    AgQuery:
      name: q
      in: query
      description: Search by text in the title or `summary`, case-insensitive and matching parts of words. A `#N` typed here
        is the same as `number`.
      schema:
        type: string
    AgSort:
      name: sort
      in: query
      description: Sort field; a leading `-` sorts descending.
      schema:
        type: string
        enum:
        - started_at
        - -started_at
        - last_changed_at
        - -last_changed_at
        default: -started_at
    AgLabelColumns:
      name: label_columns
      in: query
      description: Label names whose shared value is returned in `label_values` of each Alert Group.
      schema:
        type: array
        items:
          type: string
    AlertGroupId:
      name: alert_group_id
      in: path
      required: true
      description: Alert Group `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    IntegrationId:
      name: integration_id
      in: path
      required: true
      description: Integration `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    IntegrationTokenId:
      name: integration_token_id
      in: path
      required: true
      description: Integration token id.
      schema:
        $ref: '#/components/schemas/PublicId'
    RouteId:
      name: route_id
      in: path
      required: true
      description: Route `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    ConnectionId:
      name: connection_id
      in: path
      required: true
      description: Connection `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    DestinationId:
      name: destination_id
      in: path
      required: true
      description: Destination `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    UserId:
      name: user_id
      in: path
      required: true
      description: User `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    ServiceAccountId:
      name: service_account_id
      in: path
      required: true
      description: Service account `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    TokenId:
      name: token_id
      in: path
      required: true
      description: Token id.
      schema:
        $ref: '#/components/schemas/PublicId'
    LookupTableId:
      name: lookup_table_id
      in: path
      required: true
      description: Lookup table `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    LinkRuleId:
      name: link_rule_id
      in: path
      required: true
      description: Link rule `public_id`.
      schema:
        $ref: '#/components/schemas/PublicId'
    AccountLinkId:
      name: account_link_id
      in: path
      required: true
      description: Account link id.
      schema:
        $ref: '#/components/schemas/PublicId'
    StoredSnapshotId:
      name: stored_snapshot_id
      in: path
      required: true
      description: Stored Snapshot id.
      schema:
        $ref: '#/components/schemas/PublicId'
    SecretName:
      name: secret_name
      in: path
      required: true
      description: Name of a Destination Secret.
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
    SuggestionId:
      name: suggestion_id
      in: path
      required: true
      description: Route suggestion id.
      schema:
        $ref: '#/components/schemas/RouteSuggestionId'
    IngestTokenInPath:
      name: ingest_token
      in: path
      required: true
      description: An Integration token. Never logged.
      schema:
        type: string
  headers:
    ETag:
      description: Entity tag of the representation; send it as `If-Match` on the next update.
      schema:
        type: string
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: The request is malformed or violates the schema (`validation-failed`, with `errors[]`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation_failed:
              summary: A field violates the schema
              value:
                type: https://muster-io.github.io/muster/problems/validation-failed
                title: Validation failed
                status: 400
                detail: The request body is not valid.
                instance: /api/v1/routes
                errors:
                - pointer: /matchers/0/op
                  code: invalid_format
                  detail: op must be one of =, !=, =~, !~
    Unauthorized:
      description: 'No valid credentials (`unauthenticated`). A `code` says why where it helps: `invalid_credentials`,
        `session_expired`, `oidc_session_ended` (the session ended because the identity provider refused the user at a
        background re-check) or `oidc_recheck_required` (a Personal access token of an OIDC account after such a refusal,
        or, for an account without an offline token, past `auth.oidc_token_grace`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: https://muster-io.github.io/muster/problems/unauthenticated
                title: Unauthenticated
                status: 401
                detail: The token is missing, wrong or expired.
                instance: /api/v1/routes
            oidc_recheck_required:
              summary: A Personal access token of an OIDC account past the grace period
              value:
                type: https://muster-io.github.io/muster/problems/unauthenticated
                title: Unauthenticated
                status: 401
                detail: Sign in through OIDC to make your tokens work again.
                instance: /api/v1/alert-groups
                code: oidc_recheck_required
    Forbidden:
      description: 'Not permitted (`forbidden`). A `code` says why when it is more than a missing Permission: `csrf_invalid`,
        `session_required`, `service_account_not_allowed`, `totp_required`, `totp_enrolment_required`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            permission:
              summary: The Role lacks the Permission
              value:
                type: https://muster-io.github.io/muster/problems/forbidden
                title: Forbidden
                status: 403
                detail: This needs the Permission routes:write.
                instance: /api/v1/routes
            session_required:
              summary: A token on an operation for the web session
              value:
                type: https://muster-io.github.io/muster/problems/forbidden
                title: Forbidden
                status: 403
                detail: This operation accepts the web session only.
                instance: /api/v1/me/personal-access-tokens
                code: session_required
    NotFound:
      description: No such resource (`not-found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_found:
              value:
                type: https://muster-io.github.io/muster/problems/not-found
                title: Not found
                status: 404
                detail: No such Route.
                instance: /api/v1/routes/RT9X2QF4H7NJCA
    Conflict:
      description: A natural key already exists, the resource is in use or protected, or a Command was refused (`conflict`,
        `command-refused`, `route-has-open-alert-groups`, `default-route-immutable`); `code` says which, see `x-problem-codes`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            command_refused:
              summary: Unresolve while a newer Alert Group is open
              value:
                type: https://muster-io.github.io/muster/problems/command-refused
                title: Command refused
                status: 409
                detail: 'A newer open Alert Group #415 exists.'
                instance: /api/v1/alert-groups/AGK7M3QX9P2RTA/unresolve
                code: newer_alert_group_exists
                related_alert_group:
                  id: AGC71D0EH5MXQB
                  number: 415
            owner_must_be_user:
              summary: Acknowledge from a Service account
              value:
                type: https://muster-io.github.io/muster/problems/command-refused
                title: Command refused
                status: 409
                detail: A Service account cannot become the Owner of an Alert Group.
                instance: /api/v1/alert-groups/AGK7M3QX9P2RTA/acknowledge
                code: owner_must_be_user
            route_has_open_alert_groups:
              value:
                type: https://muster-io.github.io/muster/problems/route-has-open-alert-groups
                title: Route has open Alert Groups
                status: 409
                detail: The Route still has open Alert Groups.
                instance: /api/v1/routes/RT9X2QF4H7NJCA
                open_alert_group_count: 3
            name_taken:
              value:
                type: https://muster-io.github.io/muster/problems/conflict
                title: Conflict
                status: 409
                detail: A Route named "payments-critical" exists.
                instance: /api/v1/routes
                code: name_taken
    PreconditionFailed:
      description: '`If-Match` does not match the current ETag (`precondition-failed`). Re-read and retry.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stale:
              value:
                type: https://muster-io.github.io/muster/problems/precondition-failed
                title: Precondition failed
                status: 412
                detail: The Route changed since you read it.
                instance: /api/v1/routes/RT9X2QF4H7NJCA
    PreconditionRequired:
      description: '`If-Match` is required (`precondition-required`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://muster-io.github.io/muster/problems/precondition-required
                title: Precondition required
                status: 428
                detail: Send If-Match with the ETag of the last read.
                instance: /api/v1/routes/RT9X2QF4H7NJCA
    PayloadTooLarge:
      description: The body exceeds the limit (`payload-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            too_large:
              value:
                type: https://muster-io.github.io/muster/problems/payload-too-large
                title: Payload too large
                status: 413
                detail: The body exceeds ingest.body_limit.
                instance: /api/v1/ingest
    Unprocessable:
      description: A field is semantically invalid, with a pointer in `errors[]` (`validation-failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_regex:
              summary: A Matcher regular expression does not compile
              value:
                type: https://muster-io.github.io/muster/problems/validation-failed
                title: Validation failed
                status: 422
                detail: A field is semantically invalid.
                instance: /api/v1/routes
                errors:
                - pointer: /matchers/1/value
                  code: invalid_regex
                  detail: 'error parsing regexp: missing closing ): `api-(.*`'
            retention_order:
              summary: Summary rows would be removed before their details
              value:
                type: https://muster-io.github.io/muster/problems/validation-failed
                title: Validation failed
                status: 422
                detail: A field is semantically invalid.
                instance: /api/v1/organization
                errors:
                - pointer: /retention/alert_group_summaries_days
                  code: retention_order
                  detail: Keep Alert Group summaries at least as long as alert details (90 days).
    TooManyRequests:
      description: Rate limit exceeded (`rate-limited`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate_limited:
              value:
                type: https://muster-io.github.io/muster/problems/rate-limited
                title: Rate limited
                status: 429
                detail: Too many requests for this token.
                instance: /api/v1/alert-groups
                retry_after_seconds: 12
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    Gone:
      description: The link expired or was already used (`gone`, with `link_expired` or `link_used`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expired:
              value:
                type: https://muster-io.github.io/muster/problems/gone
                title: Gone
                status: 410
                detail: The password setup link has expired.
                instance: /api/v1/password-setups
                code: link_expired
    InternalError:
      description: The write failed or the server broke (`internal`). A sender such as Alertmanager retries a `5xx`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: https://muster-io.github.io/muster/problems/internal
                title: Internal error
                status: 500
                detail: The Snapshot could not be stored.
                instance: /api/v1/ingest
    Limited:
      description: No limiter token was free within `delivery.interactive_budget` (`interactive-budget-exhausted`); retry
        after `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            busy:
              value:
                type: https://muster-io.github.io/muster/problems/interactive-budget-exhausted
                title: Messenger is busy
                status: 503
                detail: No rate-limit token was free within 5 s.
                instance: /api/v1/destinations/DS4M1T6RW9KXPA/checks
                retry_after_seconds: 3
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, served as `application/problem+json`. `type` is a stable URI under `https://muster-io.github.io/muster/problems/`;
        clients branch on `type`, `code` and `errors[].code`, never on `title` or `detail`. Validation errors raised by the
        request-validation middleware and by the strict server are mapped to this schema by one function. Every `code` is
        listed in `x-problem-codes`.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type URI.
        title:
          type: string
          description: Short human summary; may change between releases.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human explanation of this occurrence; may change between releases.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          description: Stable machine code that refines `type`, listed per type in `x-problem-codes`. Clients branch on `type`,
            `code` and `errors[].code`, never on `title` or `detail`.
        errors:
          type: array
          description: Field-level errors. Present for `validation-failed`.
          items:
            $ref: '#/components/schemas/ProblemError'
        open_alert_group_count:
          type: integer
          description: Set on `route-has-open-alert-groups`; the number of open Alert Groups that block the deletion.
        related_alert_group:
          description: Set on refusals that name another Alert Group, such as an Unresolve refused because a newer open Alert
            Group exists.
          $ref: '#/components/schemas/AlertGroupRef'
        retry_after_seconds:
          type: integer
          description: Set on `rate-limited`; equals the `Retry-After` header.
      x-problem-types:
      - type: validation-failed
        status:
        - 400
        - 422
        description: The request is malformed (400) or a field is semantically invalid (422); see `errors`. Never returned
          by the ingestion endpoints.
      - type: unauthenticated
        status:
        - 401
        description: No valid credentials, or the sign-in or second factor was wrong (`invalid_credentials`).
      - type: forbidden
        status:
        - 403
        description: The caller lacks the Permission, the CSRF check failed, the operation needs the web session, or the session
          is limited (see `x-problem-codes`).
      - type: not-found
        status:
        - 404
        description: No such resource, or the caller may not know about it.
      - type: conflict
        status:
        - 409
        description: A natural key already exists, or the resource is in use or protected.
      - type: command-refused
        status:
        - 409
        description: A Command's precondition does not hold or the caller cannot take part; `code` says which (see `x-problem-codes`).
      - type: route-has-open-alert-groups
        status:
        - 409
        description: The Route still has open Alert Groups; see `open_alert_group_count`.
      - type: default-route-immutable
        status:
        - 409
        description: The Default route cannot be deleted or moved.
      - type: gone
        status:
        - 410
        description: A password setup link expired or was used (`link_expired`, `link_used`).
      - type: precondition-failed
        status:
        - 412
        description: '`If-Match` does not match the current ETag; re-read and retry.'
      - type: precondition-required
        status:
        - 428
        description: A configuration update was sent without `If-Match`.
      - type: payload-too-large
        status:
        - 413
        description: The body exceeds the limit (`ingest.body_limit` for ingestion).
      - type: rate-limited
        status:
        - 429
        description: The per-token rate limit was exceeded.
      - type: interactive-budget-exhausted
        status:
        - 503
        description: The call needs the interactive path and no limiter token was free within `delivery.interactive_budget`;
          retry after `Retry-After`.
      - type: internal
        status:
        - 500
        description: Unexpected server error.
      - type: not-implemented
        status:
        - 501
        description: The operation is in this specification, but this build does not implement it yet.
      x-problem-codes:
      - type: validation-failed
        in: errors[].code
        codes:
        - code: required
          description: A required field is missing or empty.
        - code: invalid_format
          description: The value has the wrong format.
        - code: unknown_id
          description: A field names a resource by its `public_id` that does not exist, that the caller may not see or that
            is of the wrong type, such as a Destination in `destination_ids` or a Mattermost Connection given to
            `startTelegramLink`.
        - code: too_long
          description: The value is longer than allowed.
        - code: too_short
          description: The value is shorter than allowed, such as a password below `auth.password_min_length`.
        - code: out_of_range
          description: The number or time is outside the allowed range, such as a Snooze `until` in the past.
        - code: invalid_regex
          description: A Matcher expression is not valid RE2.
        - code: template_syntax
          description: A template does not parse or fails its dry run; `line` and `column` say where.
        - code: unknown_function
          description: A template calls a function that is not registered.
        - code: duplicate
          description: A value appears twice where it must be unique.
        - code: unsupported
          description: The value is valid but not supported here, such as `owner=me` for a Service account token.
        - code: one_of_required
          description: Exactly one of several fields must be given, such as `until` or `no_end`.
        - code: permission_not_held
          description: A token asks for a Permission its owner does not hold, or a token assigns a Role holding a Permission
            the token does not hold (`/role`).
        - code: route_set_mismatch
          description: The Routes in a reorder differ from the current set.
        - code: column_mismatch
          description: The values of a Lookup table row do not match the table's columns.
        - code: retention_order
          description: '`retention.alert_group_summaries_days` is shorter than `retention.alert_details_days`; summary rows
            must be kept at least as long as the details.'
        - code: invalid_cursor
          description: The cursor is malformed or expired.
        - code: check_not_supported
          description: The Destination type has no Destination check (outgoing webhooks); the pointer is
            `/path/destination_id`.
        - code: destination_check_failed
          description: Saving a Mattermost or Telegram Destination ran its Destination check, a check failed and nothing
            was saved. One item per failing check, at the field the check concerns — `/connection_id` for `token`,
            `/channel_id` for the others (see `DestinationCheckItem`) — with the check's message as `detail`.
        - code: link_code_invalid
          description: The Mattermost link code is wrong, or its request is void, used or expired; never says which. The
            pointer is `/code` (`confirmMattermostLink`).
        - code: messenger_user_not_found
          description: The Mattermost server has no user with this username; the pointer is `/username`
            (`startMattermostLink`).
      - type: unauthenticated
        in: code
        codes:
        - code: invalid_credentials
          description: Wrong login, password, TOTP code, recovery code or proof; never says which.
        - code: session_expired
          description: The session ended by idle timeout or lifetime.
        - code: oidc_session_ended
          description: The session ended because the identity provider refused the user at a background re-check (the user
            was banned or disabled, or the IdP ended the grant); sign in again.
        - code: oidc_recheck_required
          description: A Personal access token of an OIDC account after the identity provider refused the user, until the next
            OIDC sign-in; or, for an account without an offline token, whose last OIDC sign-in is older than
            `auth.oidc_token_grace`. The text says "Sign in through OIDC to make your tokens work again." The token is not
            revoked.
      - type: forbidden
        in: code
        codes:
        - code: csrf_invalid
          description: The `X-CSRF-Token` header is missing or wrong on a mutating request made with the session cookie,
            or a browser marked a mutating request as cross-site (`Sec-Fetch-Site` set to `cross-site`).
        - code: session_required
          description: The operation changes the caller's own account and accepts the web session only.
        - code: service_account_not_allowed
          description: The operation needs a User and the caller is a Service account.
        - code: totp_required
          description: The session waits for a TOTP code (`submitSessionTotp`).
        - code: totp_enrolment_required
          description: The session must enrol TOTP first (`beginTotpEnrolment`, `confirmTotpEnrolment`).
      - type: conflict
        in: code
        codes:
        - code: name_taken
          description: A natural key, such as a name, already exists.
        - code: in_use
          description: Other resources still use this one, such as a Connection with Destinations that are not deleted.
        - code: builtin_immutable
          description: The built-in Integration or Link rule cannot be changed this way.
        - code: role_locked
          description: The identity provider decides the Role of this OIDC account while OIDC and `oidc.sync_role` are both
            on.
        - code: local_user_only
          description: 'The operation is refused for an account that signs in through OIDC: password change, password setup
            link. Convert the account first (`convertUserToLocal`).'
        - code: oidc_not_enabled
          description: OIDC sign-in is switched off.
        - code: oidc_already_linked
          description: The account already has an OIDC identity; unlink it first.
        - code: oidc_not_linked
          description: The account does not sign in through OIDC, so there is nothing to convert to local.
        - code: totp_already_enrolled
          description: TOTP is already on.
        - code: totp_not_enrolled
          description: There is no TOTP to use or change.
        - code: totp_enrolment_not_started
          description: Confirmation without a begun enrolment.
        - code: totp_not_pending
          description: The session is not waiting for a TOTP code.
        - code: suggestion_obsolete
          description: The Route suggestion no longer applies.
        - code: not_webhook_destination
          description: Secrets and the Signing secret exist for outgoing webhook Destinations only.
        - code: account_linked_elsewhere
          description: The messenger account is linked to another User.
        - code: last_admin
          description: The change would leave the Organization without an active Admin; the last active Admin cannot be
            disabled, deleted or given a lower Role.
      - type: command-refused
        in: code
        codes:
        - code: already_resolved
          description: Acknowledge, Resolve or Snooze on a resolved Alert Group.
        - code: not_acknowledged
          description: Unacknowledge on an Alert Group that is not acknowledged.
        - code: not_snoozed
          description: Unsnooze on an Alert Group that is not snoozed.
        - code: not_resolved
          description: Unresolve on an Alert Group that is not resolved.
        - code: all_alerts_resolved
          description: Unresolve when every Alert has resolved.
        - code: resolved_automatically
          description: Unresolve of an Alert Group the system resolved; it reopens by itself.
        - code: newer_alert_group_exists
          description: Unresolve while a newer open Alert Group with the same key exists; `related_alert_group` names it.
        - code: not_owner
          description: '"Still on it" by someone who is not the Owner.'
        - code: no_reminder_pending
          description: '"Still on it" with no Reminder waiting.'
        - code: owner_must_be_user
          description: 'Acknowledge or "Still on it" from a Service account: an Owner is always a User.'
      - type: gone
        in: code
        codes:
        - code: link_expired
          description: The password setup link is older than `auth.password_setup_link_ttl`.
        - code: link_used
          description: The password setup link was used or replaced by a newer one.
    ProblemError:
      type: object
      required:
      - pointer
      - code
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON Pointer to the offending field in the request body, or `` for the whole body. Query and
            path parameters use `/query/<name>` and `/path/<name>`.
        code:
          type: string
          description: Stable code such as `required`, `invalid_format`, `unknown_id`, `too_long`, `too_short`, `out_of_range`, `invalid_regex`,
            `template_syntax`, `unknown_function`, `duplicate`, `unsupported`.
        detail:
          type: string
          description: Human explanation; may change between releases.
        line:
          type: integer
          minimum: 1
          description: Line of a template error.
        column:
          type: integer
          minimum: 1
          description: Column of a template error.
    SecretStatus:
      type: object
      description: What a read shows instead of a Secret. The value itself is never returned.
      required:
      - set
      properties:
        set:
          type: boolean
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
    EntityRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
    AlertGroupRef:
      type: object
      required:
      - id
      - number
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        number:
          type: integer
          description: The `#N` of the Alert Group.
    Labels:
      type: object
      description: Label names and values.
      additionalProperties:
        type: string
    Matcher:
      type: object
      description: A condition on one label, in Alertmanager syntax. Matchers of a Route are combined with AND.
      required:
      - label
      - op
      - value
      properties:
        label:
          type: string
          minLength: 1
        op:
          type: string
          enum:
          - '='
          - '!='
          - =~
          - '!~'
        value:
          type: string
          description: Literal value, or an RE2 expression for `=~` and `!~`.
    Limiter:
      type: object
      description: A rate limit of `limit` calls per `per_seconds`.
      required:
      - limit
      - per_seconds
      properties:
        limit:
          type: integer
          minimum: 1
        per_seconds:
          type: integer
          minimum: 1
    ProxyType:
      type: string
      enum:
      - http
      - https
      - socks5
    ProxyConfig:
      type: object
      description: Per-client proxy as read. The password is a Secret.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        type:
          $ref: '#/components/schemas/ProxyType'
        address:
          type: string
          description: '`host:port`.'
        username:
          type:
          - string
          - 'null'
        password_status:
          $ref: '#/components/schemas/SecretStatus'
    ProxyConfigInput:
      type: object
      description: Per-client proxy as written. Omitting `password` keeps the stored one; `null` clears it.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        type:
          $ref: '#/components/schemas/ProxyType'
        address:
          type: string
          description: '`host:port`; the proxy''s own address is checked by the outbound address policy.'
        username:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
          writeOnly: true
          description: Write-only Secret. Omit to keep the stored one; `null` clears it.
    RoleName:
      type: string
      enum:
      - admin
      - responder
      - viewer
    UserStatus:
      type: string
      enum:
      - active
      - disabled
      - deleted
    UserSource:
      type: string
      description: How the account was created; `sign_in_method` says how it signs in now (linking OIDC or a conversion by
        an Admin changes it).
      enum:
      - local
      - oidc
      - bootstrap
    Permission:
      type: string
      description: |
        One thing a Role allows, named `<resource>:<verb>`. Every operation lists the Permission it needs in `x-permission`. A Personal access token can only narrow its owner's Permissions; a Service account has its Role's Permissions.

        | Permission | Admin | Responder | Viewer |
        |---|---|---|---|
        | `alert-groups:read`, `alerts:read` | yes | yes | yes |
        | `integrations:read`, `routes:read`, `connections:read`, `destinations:read`, `link-rules:read`, `lookup-tables:read` (Secrets masked) | yes | yes | yes |
        | `alert-groups:acknowledge` (also "Still on it"), `alert-groups:resolve`, `alert-groups:snooze`, `alert-groups:note` | yes | yes | no |
        | `integrations:write`, `routes:write`, `connections:write`, `destinations:write`, `destinations:test`, `link-rules:write`, `lookup-tables:write`, `templates:preview` | yes | no | no |
        | `stored-snapshots:read` | yes | no | no |
        | `users:read`, `users:write`, `oidc:read`, `oidc:write`, `service-accounts:read`, `service-accounts:write`, `organization:read`, `organization:write` | yes | no | no |
        | `audit-log:read`, `system-status:read` | yes | no | no |

        `organization:read` covers the settings pages only Admins see (outbound address policy, Keyring status, severity values seen). The basic read of the `organization` resource needs no Permission.

        The special values `authenticated` (any signed-in identity: own profile, TOTP, Account links, Personal access tokens, the basic `organization` read, system notices, live updates), `integration-token` (ingestion and Heartbeat only) and `none` (public, or authenticated by the request itself, such as a signed messenger callback) appear only in `x-permission`.
      enum:
      - alert-groups:read
      - alert-groups:acknowledge
      - alert-groups:resolve
      - alert-groups:snooze
      - alert-groups:note
      - alerts:read
      - integrations:read
      - integrations:write
      - stored-snapshots:read
      - routes:read
      - routes:write
      - connections:read
      - connections:write
      - destinations:read
      - destinations:write
      - destinations:test
      - link-rules:read
      - link-rules:write
      - lookup-tables:read
      - lookup-tables:write
      - templates:preview
      - users:read
      - users:write
      - oidc:read
      - oidc:write
      - service-accounts:read
      - service-accounts:write
      - organization:write
      - organization:read
      - audit-log:read
      - system-status:read
    Transport:
      type: string
      description: How a Command or change reached Muster. `cli` marks audited CLI commands (`--actor`); `system` marks transitions
        Muster starts on its own.
      enum:
      - ui
      - api
      - mattermost
      - telegram
      - cli
      - system
    SeverityLevel:
      type: string
      enum:
      - critical
      - warning
      - info
    AlertGroupStatus:
      type: string
      enum:
      - firing
      - acknowledged
      - snoozed
      - resolved
    NullableAlertGroupStatus:
      type:
      - string
      - 'null'
      enum:
      - firing
      - acknowledged
      - snoozed
      - resolved
      - null
    ResolveReason:
      type: string
      description: Why an Alert resolved.
      enum:
      - resolved
      - gone
      - stale
      - integration_deleted
    ResolverKind:
      type: string
      description: 'Who resolved an Alert Group: a person or the system.'
      enum:
      - user
      - system
    NullableResolveReason:
      type:
      - string
      - 'null'
      description: Why an Alert resolved; null while it fires.
      enum:
      - resolved
      - gone
      - stale
      - integration_deleted
      - null
    Language:
      type: string
      enum:
      - en
      - ru
    NullableLanguage:
      type:
      - string
      - 'null'
      description: UI or template language; null follows the default.
      enum:
      - en
      - ru
      - null
    SignInOptions:
      type: object
      description: What the sign-in page offers besides the local form, which is always shown.
      required:
      - oidc
      properties:
        oidc:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
            display_name:
              type: string
              description: Provider name for the button "Sign in with {display_name}". Present while OIDC is enabled.
    SessionCreate:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
          description: Compared case-insensitively.
        password:
          type: string
          format: password
          writeOnly: true
        totp_code:
          type: string
          description: Current TOTP code, if the user has TOTP and wants to finish in one request.
        recovery_code:
          type: string
          writeOnly: true
          description: A single-use recovery code instead of `totp_code`.
    SessionTotp:
      type: object
      description: Exactly one of the two fields.
      minProperties: 1
      maxProperties: 1
      properties:
        totp_code:
          type: string
          description: Current TOTP code.
        recovery_code:
          type: string
          writeOnly: true
          description: A single-use recovery code.
    SessionState:
      type: string
      description: '`totp_required` after the password (or OIDC) step when the user has TOTP and the code was not yet given;
        `totp_enrolment_required` while the Organization''s TOTP policy demands enrolment. In both limited states `permissions`
        is empty and only `getCurrentSession`, `deleteCurrentSession` and, per state, `submitSessionTotp` (`totp_required`)
        or `beginTotpEnrolment`, `confirmTotpEnrolment` and `getMyTotp` (`totp_enrolment_required`) work; everything else
        answers `403` with the code `totp_required` or `totp_enrolment_required`.'
      enum:
      - active
      - totp_required
      - totp_enrolment_required
    Session:
      type: object
      required:
      - user
      - state
      - csrf_token
      - expires_at
      - idle_expires_at
      - method
      - permissions
      properties:
        user:
          $ref: '#/components/schemas/User'
        state:
          $ref: '#/components/schemas/SessionState'
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on every mutating request made with the session cookie.
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        method:
          $ref: '#/components/schemas/SessionMethod'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Empty while the session is limited (`totp_required`, `totp_enrolment_required`).
    SessionMethod:
      type: string
      description: How the session signed in. OIDC accounts are re-checked at the identity provider per user, in the
        background, with the offline token the IdP granted at sign-in (`offline_access`); when the IdP refuses the user,
        all of the user's sessions end and the next request gets `401` with `oidc_session_ended`. An `oidc` session of a
        user without an offline token ends at most `auth.oidc_fallback_session_lifetime` after sign-in.
      enum:
      - local
      - oidc
    SessionInfo:
      type: object
      required:
      - id
      - method
      - created_at
      - last_used_at
      - current
      properties:
        method:
          $ref: '#/components/schemas/SessionMethod'
        id:
          $ref: '#/components/schemas/PublicId'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        address:
          type:
          - string
          - 'null'
        user_agent:
          type:
          - string
          - 'null'
        current:
          type: boolean
    SessionInfoList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
    User:
      type: object
      required:
      - id
      - name
      - login
      - role
      - source
      - sign_in_method
      - status
      - totp_enabled
      - created_at
      - etag
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
          description: Display name. `deleted-user-<id>` after deletion.
        login:
          type: string
          description: As entered. Logins are case-insensitive; uniqueness and sign-in compare them lowercased.
        email:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/RoleName'
        role_locked:
          type: boolean
          description: True for an account that signs in through OIDC while OIDC and `oidc.sync_role` are both on, so the
            identity provider decides the Role.
        source:
          $ref: '#/components/schemas/UserSource'
        oidc_offline_access:
          type: boolean
          readOnly: true
          description: True while Muster holds an offline token from the identity provider for this OIDC account, so it is
            re-checked in the background and its Personal access tokens have no inactivity limit. The token itself is never
            returned.
        sign_in_method:
          type: string
          readOnly: true
          description: How the user signs in now, one way only. `local` with a password (which may still wait for its setup
            link); `oidc` only through the identity provider, which is then the only source of truth for the account —
            created through OIDC, or a local account that linked an identity and lost its password.
          enum:
          - local
          - oidc
        status:
          $ref: '#/components/schemas/UserStatus'
        totp_enabled:
          type: boolean
        time_zone:
          type:
          - string
          - 'null'
          description: IANA time zone; null follows the browser.
        language:
          description: UI language; null follows the browser.
          $ref: '#/components/schemas/NullableLanguage'
        last_sign_in_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        etag:
          type: string
          readOnly: true
          description: The same value as the `ETag` header; send it as `If-Match` on the next update. Lets a client update
            an item of a list without reading it again.
    UserList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type:
          - string
          - 'null'
    UserDirectoryList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserRef'
        next_cursor:
          type:
          - string
          - 'null'
    UserCreate:
      type: object
      required:
      - name
      - login
      - role
      properties:
        name:
          type: string
          minLength: 1
        login:
          type: string
          minLength: 1
          description: Stored as entered and unique case-insensitively in the Organization (`409` `name_taken` when another
            user has the same login in any case).
        email:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/RoleName'
    UserUpdate:
      type: object
      required:
      - name
      - role
      properties:
        name:
          type: string
          minLength: 1
        email:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/RoleName'
    PasswordSetupLink:
      type: object
      description: Single-use link the Admin hands over; Muster sends no email. The token is in the URL fragment (`<public
        url>/password-setup#token=<token>`), so it is not sent to any server until the page posts it.
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    UserCreated:
      type: object
      required:
      - user
      - password_setup_link
      properties:
        user:
          $ref: '#/components/schemas/User'
        password_setup_link:
          $ref: '#/components/schemas/PasswordSetupLink'
    Role:
      type: object
      required:
      - name
      - permissions
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    RoleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Me:
      type: object
      required:
      - user
      - permissions
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          description: Effective Permissions of the caller, narrowed by the token if one is used.
          items:
            $ref: '#/components/schemas/Permission'
    OidcLinkStart:
      type: object
      required:
      - authorization_url
      - expires_at
      properties:
        authorization_url:
          type: string
          format: uri
          description: The identity provider's authorization endpoint with the link request; open it in the browser.
        expires_at:
          type: string
          format: date-time
          description: The link must be completed before this time.
    MeUpdate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        time_zone:
          type:
          - string
          - 'null'
        language:
          $ref: '#/components/schemas/NullableLanguage'
    PasswordChange:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
        new_password:
          type: string
          format: password
          writeOnly: true
          description: At least `auth.password_min_length` characters; a shorter one gets `422` with `too_short`.
    PasswordSetup:
      type: object
      required:
      - token
      - password
      properties:
        token:
          type: string
          writeOnly: true
          description: The token from the setup link.
        password:
          type: string
          format: password
          writeOnly: true
          description: At least `auth.password_min_length` characters; a shorter one gets `422` with `too_short`.
    TotpStatus:
      type: object
      required:
      - enrolled
      - enrolment_pending
      - recovery_codes_remaining
      properties:
        enrolled:
          type: boolean
        enrolled_at:
          type:
          - string
          - 'null'
          format: date-time
        enrolment_pending:
          type: boolean
        recovery_codes_remaining:
          type: integer
    TotpEnrolment:
      type: object
      description: Shown once, while enrolling. The UI renders `otpauth_uri` as a QR code.
      required:
      - secret
      - otpauth_uri
      properties:
        secret:
          type: string
          description: Base32 seed for manual entry.
        otpauth_uri:
          type: string
    TotpRemoval:
      type: object
      description: One proof is enough.
      minProperties: 1
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          description: The current password; local users only.
        totp_code:
          type: string
          description: Current TOTP code.
        recovery_code:
          type: string
          writeOnly: true
          description: A single-use recovery code.
    TotpCode:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          description: Current TOTP code.
    TotpRecoveryCodes:
      type: object
      description: Single-use recovery codes, shown once.
      required:
      - codes
      properties:
        codes:
          type: array
          items:
            type: string
    ServiceAccountToken:
      type: object
      required:
      - id
      - name
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
          minLength: 1
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null means the token never expires; the UI warns.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_address:
          type:
          - string
          - 'null'
    PersonalAccessToken:
      type: object
      required:
      - id
      - name
      - created_at
      - permissions
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
          minLength: 1
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null means the token never expires; the UI warns.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_address:
          type:
          - string
          - 'null'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    PersonalAccessTokenList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonalAccessToken'
    PersonalAccessTokenCreate:
      type: object
      required:
      - name
      - permissions
      properties:
        name:
          type: string
          minLength: 1
        permissions:
          type: array
          minItems: 1
          description: Must be a subset of the Permissions the caller holds.
          items:
            $ref: '#/components/schemas/Permission'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    PersonalAccessTokenCreated:
      type: object
      required:
      - token
      - value
      properties:
        token:
          $ref: '#/components/schemas/PersonalAccessToken'
        value:
          type: string
          description: The token, starting with `mstr_pat_`. Shown once.
    ServiceAccount:
      type: object
      required:
      - id
      - name
      - role
      - status
      - token_count
      - created_at
      - etag
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/RoleName'
        status:
          type: string
          enum:
          - active
          - disabled
        token_count:
          type: integer
        created_at:
          type: string
          format: date-time
        etag:
          type: string
          readOnly: true
          description: The same value as the `ETag` header; send it as `If-Match` on the next update. Lets a client update
            an item of a list without reading it again.
      description: 'A non-person identity with a Role and tokens. It cannot sign in and has no Account links. It can never
        become the Owner of an Alert Group: Acknowledge and "Still on it" from it are refused with `command-refused` `owner_must_be_user`;
        it may Resolve, Snooze and add Notes.'
    ServiceAccountInput:
      type: object
      required:
      - name
      - role
      properties:
        name:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/RoleName'
    ServiceAccountList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
        next_cursor:
          type:
          - string
          - 'null'
    ServiceAccountTokenList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountToken'
    ServiceAccountTokenCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    ServiceAccountTokenCreated:
      type: object
      required:
      - token
      - value
      properties:
        token:
          $ref: '#/components/schemas/ServiceAccountToken'
        value:
          type: string
          description: The token, starting with `mstr_sat_`. Shown once.
    OidcGroupMapping:
      type: object
      required:
      - group
      - role
      properties:
        group:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/RoleName'
    OidcUnmatchedRole:
      type: string
      description: Role for users without a matching group; `none` refuses the sign-in.
      enum:
      - none
      - viewer
      - responder
    OidcSettingsBase:
      type: object
      required:
      - enabled
      - issuer_url
      - client_id
      - groups_claim
      - group_mappings
      - unmatched_role
      - sync_role
      - skip_totp_with_idp_mfa
      properties:
        enabled:
          type: boolean
        display_name:
          type: string
          description: Provider name for the button "Sign in with {display_name}". Defaults to the host of the issuer URL;
            a read leaves it out while the default applies, and an empty value returns to the default.
        issuer_url:
          type: string
          format: uri
        client_id:
          type: string
        client_secret_expires_on:
          type:
          - string
          - 'null'
          format: date
          description: Optional expiry date of the client secret; the OIDC settings warn within `oidc.secret_expiry_lead`.
        scopes:
          type: array
          description: Scopes requested at sign-in and linking. Muster always adds `openid` and `offline_access`; allow
            `offline_access` for the Muster client at the IdP, or users are not re-checked in the background, OIDC sessions
            end after `auth.oidc_fallback_session_lifetime`, and Personal access tokens follow `auth.oidc_token_grace`.
          items:
            type: string
        groups_claim:
          type: string
        group_mappings:
          type: array
          items:
            $ref: '#/components/schemas/OidcGroupMapping'
        unmatched_role:
          $ref: '#/components/schemas/OidcUnmatchedRole'
        sync_role:
          type: boolean
          description: 'On: the identity provider decides the Role at every sign-in. Off: the mapping applies only when the
            user is created.'
        skip_totp_with_idp_mfa:
          type: boolean
    OidcWarning:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - nobody_can_sign_in
          - groups_claim_missing
          - secret_expiring
          - last_admin_kept
          description: '`nobody_can_sign_in`: the mapping is empty and unmatched users get no Role. `groups_claim_missing`:
            discovery does not advertise the groups claim, or a test sign-in carried no such claim. `secret_expiring`: see
            `expires_on`. `last_admin_kept`: Role sync left `user` as Admin because they are the last active Admin,
            although the identity provider maps them to `role`.'
        expires_on:
          type:
          - string
          - 'null'
          format: date
        user:
          description: For `last_admin_kept`, the Admin whose Role sync was not applied.
          $ref: '#/components/schemas/UserRef'
        role:
          description: For `last_admin_kept`, the Role the identity provider maps the user to.
          $ref: '#/components/schemas/RoleName'
    OidcSettings:
      allOf:
      - $ref: '#/components/schemas/OidcSettingsBase'
