          type: object
          additionalProperties:
            type: string
        duration_ms:
          type: integer
        error_class:
          $ref: '#/components/schemas/DeliveryErrorClass'
        error:
          type:
          - string
          - 'null'
          description: What failed. Secrets, the Signing secret and tokens are masked.
