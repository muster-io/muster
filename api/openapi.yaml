  /callbacks/mattermost/{connection_id}:
    post:
      operationId: mattermostAction
      tags:
      - Messenger callbacks
      summary: Receive a Mattermost button press
      description: 'Sent by the Mattermost server. Mattermost does not sign the request: Muster verifies the signed action
        id with the key it names, checks that `post_id` and `channel_id` belong to the post the id was issued for, maps `user_id`
        to a User through the Account link of this Connection and dispatches the Command with the Transport `mattermost`.
        Every request is answered with `200` and an empty JSON object, refusals, an unknown or deleted Connection, a bad
        signature and a body that is not JSON or does not match `MattermostActionRequest` included, so the endpoint tells
        a caller nothing about which Connection ids exist; request validation does not answer `400` here. The answer never
        carries `update` (only the delivery worker edits the Root message) or `ephemeral_text` (Mattermost would show it
        only inside the Thread); whatever the person who pressed must read is sent as a separate ephemeral post.'
      x-permission: none
      x-listener: ingest
      servers:
