webhooks:
  alertGroupEvent:
    post:
      operationId: deliverAlertGroupEvent
      tags:
      - Outgoing webhooks
      summary: Events-mode request to an outgoing webhook Destination
      description: |-
        Sent by Muster to the URL of an outgoing webhook Destination in events mode: one POST per lifecycle event, in order per Alert Group, at least once.
        Every request carries `webhook-id`, `webhook-timestamp` and `webhook-signature` in the style of the Standard Webhooks specification: the signature is
        `v1,<base64 HMAC-SHA256>` over `<webhook-id>.<webhook-timestamp>.<body>`, with several space-separated signatures while a previous Signing secret
        is not yet retired. Receivers drop duplicates by `webhook-id`. Response mapping: `2xx` delivered; `429` or `503` with `Retry-After` retried exactly as asked;
        `408`, other `5xx`, timeouts and network errors retried with backoff; `401`, `403`, `404` and `410` mark the Destination Broken; `400`, `413`, `422`,
        redirects and everything else end that delivery as Not delivered.
      x-permission: none
      parameters:
      - name: webhook-id
        in: header
        required: true
        description: Id of this event, kept across retries.
        schema:
          type: string
      - name: webhook-timestamp
        in: header
        required: true
        description: Unix time in seconds when the request was signed.
        schema:
          type: string
      - name: webhook-signature
        in: header
        required: true
        description: One or more space-separated `v1,<base64>` signatures.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutgoingWebhookEvent'
