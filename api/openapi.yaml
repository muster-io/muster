  /ingest:
    post:
      operationId: ingestSnapshot
      tags:
      - Ingest
      summary: Receive an Alertmanager webhook
      description: 'Checks the token, then the body size, stores the body as a Stored Snapshot exactly as received and answers
        `202` after the write commits, without waiting for processing. It never answers `400`: a body that is not JSON, or
        does not look like an Alertmanager payload, is stored and fails later as a processing error (log event, `muster_ingest_failed_snapshots_total`,
        Stored Snapshot state `failed`), because Alertmanager does not retry a `4xx` and the notification would be lost. Not
        rate-limited. Counted in `muster_ingest_requests_total` with the outcome `accepted`, `unauthorized` or `too_large`.
        The only `5xx` is a failed write, which Alertmanager retries. Ingestion is excluded from request validation by the
        spec: the handler reads the raw body and the generated types are not used for it.'
      x-permission: integration-token
      x-listener: ingest
      servers:
      - url: '{ingest_url}/api/v1'
        description: Ingest listener (`MUSTER_INGEST_URL`), the address for machines.
        variables:
          ingest_url:
            default: https://ingest.muster.example.org
        x-listener: ingest
      security:
      - integrationToken: []
      requestBody:
        required: true
        description: Any bytes up to `ingest.body_limit`. Alertmanager sends `application/json`; see `AlertmanagerWebhook`.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: The Snapshot was stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
