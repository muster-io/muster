          bot_token_status:
            $ref: '#/components/schemas/SecretStatus'
          proxy:
            $ref: '#/components/schemas/ProxyConfig'
          destination_count:
            type: integer
            description: A Connection used by Destinations cannot be deleted.
          callback_url:
            type: string
            format: uri
            readOnly: true
            description: The address that Mattermost calls for button presses of this Connection — `mattermostAction` at
              `MUSTER_INGEST_URL` (`<MUSTER_INGEST_URL>/api/v1/callbacks/mattermost/<id>`). The Connection page shows it
              with the hint about `AllowedUntrustedInternalConnections`.
          created_at:
            type: string
            format: date-time
          etag:
            type: string
            readOnly: true
            description: The same value as the `ETag` header; send it as `If-Match` on the next update. Lets a client update
              an item of a list without reading it again.
    MattermostConnectionInput:
      allOf:
      - $ref: '#/components/schemas/MattermostConnectionBase'
      - type: object
        required:
        - proxy
        properties:
          bot_token:
            type: string
            format: password
            writeOnly: true
            description: Write-only Secret. Omit on update to keep the stored one.
          proxy:
            $ref: '#/components/schemas/ProxyConfigInput'
    TelegramUpdateMode:
      type: string
