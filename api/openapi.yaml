  /alert-groups/bulk-commands:
    post:
      operationId: runBulkCommand
      tags:
      - Alert groups
      summary: Run a Command on several Alert Groups
      description: 'Acknowledge, Resolve, Snooze or Unsnooze on up to `alert_group.bulk_max` Alert Groups. Each goes through
        the dispatcher on its own, with its own Audit log and Timeline entry; a refusal never stops the others. Bulk Acknowledge
        skips Alert Groups another user owns and never makes a Takeover. `x-permission` lists alternatives: the caller needs
        the Permission of the chosen command (`acknowledge` needs `alert-groups:acknowledge`, `resolve` needs `alert-groups:resolve`,
        `snooze` and `unsnooze` need `alert-groups:snooze`).'
      x-permission:
      - alert-groups:acknowledge
      - alert-groups:resolve
      - alert-groups:snooze
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCommandRequest'
            examples:
              snooze:
                value:
                  command: snooze
                  alert_group_ids:
                  - AGK7M3QX9P2RTA
                  - AGC71D0EH5MXQB
                  snooze:
                    until: '2026-10-04T08:00:00Z'
              snooze_no_end:
                value:
                  command: snooze
                  alert_group_ids:
                  - AGK7M3QX9P2RTA
                  snooze:
                    no_end: true
              resolve:
                value:
                  command: resolve
                  alert_group_ids:
                  - AGK7M3QX9P2RTA
                  note: Fixed by the rollback.
      responses:
        '200':
          description: One outcome per Alert Group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCommandResult'
              examples:
                mixed:
                  summary: Acknowledge of three Alert Groups
                  value:
                    results:
                    - alert_group_id: AGK7M3QX9P2RTA
                      number: 412
                      outcome: done
                    - alert_group_id: AGC71D0EH5MXQB
                      number: 415
                      outcome: refused
                      code: already_resolved
                      message: already resolved
                    - alert_group_id: AG51BE90Y6KTRW
                      number: 417
                      outcome: skipped
                      code: owned_by_other
                      message: 'skipped: owned by Alice'
                    - alert_group_id: AGX0000000000Z
                      number: null
                      outcome: failed
                      code: not_found
                      message: not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
