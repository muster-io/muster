      description: 'The Connection''s bot sends a direct message with a code to the `@username`. Code requests are limited
        per requesting User and per target account (`429` with `Retry-After`). Refused with `409` if the account is already
        linked to another user. Runs on the interactive path: when no limiter token is free within `delivery.interactive_budget`,
