          type:
          - string
          - 'null'
          description: 'Why processing failed, for `failed`: for example the body is not valid JSON or does not look like
            an Alertmanager payload. The body itself stays as received.'
    SnapshotState:
      type: string
      description: '`pending` until a worker has processed it, `processed`, or `failed` when the body could not be processed.
        A failed Snapshot is never retried by itself; `muster ingest replay` reprocesses it after a fix.'
