    AlertmanagerAlert:
      type: object
      required:
      - status
      - labels
      - startsAt
      properties:
        status:
          $ref: '#/components/schemas/AlertState'
        labels:
          $ref: '#/components/schemas/Labels'
        annotations:
          $ref: '#/components/schemas/Labels'
        startsAt:
          type: string
          format: date-time
