        retries. Events of one Alert Group are sent in order, at least once and never collapsed; a greater `sequence` means
        a newer event of the same Alert Group, and nothing more. New event names and new fields are added within `version`
        1; removing a field or changing its meaning needs a new `version`. Receivers must ignore unknown `event` values
        and unknown fields.
      required:
      - version
      - event
      - notify
      - mentions
      - occurred_at
      - actor
      - alert_group
      - alerts
      - sequence
      properties:
        version:
          type: integer
          enum:
          - 1
        event:
          $ref: '#/components/schemas/WebhookEventName'
        notify:
          type: boolean
          description: True exactly when the event is Loud.
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/WebhookMentionTarget'
        sequence:
          type: integer
          minimum: 0
          description: The lifecycle event number of the Alert Group, kept across retries. It grows with every lifecycle event
            of the Alert Group but may have gaps, and for a Destination added to the Route later it does not start at 1;
            receivers rely only on "greater means newer". 0 on the `test` event.
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/WebhookActor'
        alert_group:
          $ref: '#/components/schemas/WebhookAlertGroup'
        alerts:
          type: array
          description: One element per Alert, by fingerprint.
          items:
            $ref: '#/components/schemas/WebhookAlert'
        test:
          type: boolean
          description: True only on the `test` event, which carries an example or recent Alert Group and belongs to no Alert
            Group's order.
security:
- sessionCookie: []
- apiToken: []
