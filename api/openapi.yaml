        tokens are revoked and Account links are removed. Every acknowledged Alert Group the user owns becomes firing
        without an Owner, with an `unacknowledged` Timeline entry by the system and the reason `owner_deleted`. Audit
        log rows are never changed. The last active Admin cannot be deleted (`409` `last_admin`).'
