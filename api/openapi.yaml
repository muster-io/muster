openapi: 3.1.2
info:
  title: Muster API
  version: 0.1.0
  summary: Muster L1 API
  description: |-
    Spec-first contract of Muster L1: alert grouping and on-call after Alertmanager.

    **Listeners.** Operations are served by one of three listeners, marked `x-listener`: `app` (UI and API, the default server), `ingest` (ingestion, Heartbeat, messenger callbacks; the address for machines) and `internal` (health and metrics). When two listeners share an address, both are served on that one port.

    **Permissions.** Every operation lists the Permission it needs in `x-permission` (`<resource>:<verb>`; see the `Permission` schema for the Role matrix), or one of `authenticated` (any signed-in identity), `integration-token` or `none`. A Personal access token can only narrow its owner's Permissions.

    **Credentials.** Operations that change the caller's own account (profile, password, TOTP, Personal access tokens, Account links, sessions) accept the web session with its CSRF token only; a token gets `403` (`session_required`). Service account tokens get `403` (`service_account_not_allowed`) on the reads under `/me`.

    **Conventions.** Resources are plural kebab-case nouns and URLs use the opaque `public_id`. Lists use cursor pagination (`cursor`, `limit` default 50, maximum 500; the response carries `next_cursor`) and filters as query parameters. Errors are RFC 9457 `application/problem+json` (`Problem`; the stable codes are catalogued in `x-problem-codes`). An operation that this build does not implement yet answers `501` (`not-implemented`). Configuration resources return an `ETag` header and an `etag` field; updates are `PUT` with `If-Match` and fail with `412` on a mismatch, `428` without it. On an update an omitted optional field keeps its stored value and an explicit `null` clears it. A natural-key conflict is `409`. Rate limits answer `429` with `Retry-After`. Times are RFC 3339 in UTC; durations are integer seconds in fields named `*_seconds` (retention periods are whole days in `*_days`, measured latencies are milliseconds in `*_ms`). Enum values are snake_case; kebab-case is kept for URL segments, problem types and the `type` of live-update hints. Secret fields are write-only; reads show `*_status` objects with `set` and `updated_at`.

    **Not validated by the spec.** The ingestion endpoints accept any body up to the size limit and store it as received; they are excluded from request validation (see `ingestSnapshot`).

    During 0.x breaking changes are allowed; from 1.0 `/api/v1` is stable and a removal is announced one minor release in advance.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
- url: '{public_url}/api/v1'
  description: App listener (`MUSTER_PUBLIC_URL`), the address for people.
  variables:
    public_url:
      default: https://muster.example.org
  x-listener: app
tags:
- name: Sessions
  description: 'Sign in with a local account or OIDC, the second factor, sessions, password setup. Public sign-in operations
    need no credentials. A session can be limited: while `state` is `totp_required` or `totp_enrolment_required` only the
    operations named in `Session` work; others answer `403` with the same code.'
- name: Profile
  description: The caller's own profile, password, sessions and TOTP.
- name: Users
  description: Users and Roles. Admin only.
- name: OIDC
  description: OIDC settings and the connection check.
- name: Audit log
  description: The append-only record of who changed or did what.
- name: API tokens
  description: Personal access tokens and Service accounts with their tokens.
- name: Organization
  description: Organization settings, the outbound address policy, the Keyring status and severity values seen.
- name: Integrations
  description: Integrations, their tokens, learned Alertmanager routes, the Alerts view and Stored Snapshots.
- name: Ingest
  description: Alertmanager webhook and Heartbeat endpoints on the ingest listener. Integration tokens only.
- name: Messenger callbacks
  description: Mattermost button presses and the optional Telegram webhook, on the ingest listener.
- name: Routes
  description: Routes, Matchers, Group key previews, profiles and suggestions.
- name: Alert groups
  description: Alert Groups, their Alerts, Timeline, Notes, delivery state, statistics and Commands.
- name: Live updates
  description: The server-sent events stream of change hints at `/live-updates`.
- name: Connections
  description: Mattermost and Telegram Connections.
- name: Destinations
  description: Destinations of all types, their checks, tests, previews, Secrets and Signing secret.
- name: Links
  description: Lookup tables and Link rules.
- name: Templates
  description: Template preview and dry run.
- name: Account links
  description: Ties between Users and messenger accounts. Started only from a signed-in web session.
- name: System
  description: System status, notices and the served specification.
- name: Health and metrics
  description: 'Liveness, readiness and metrics on the internal listener. Hand-written handlers: excluded from the generated
    server.'
- name: Outgoing webhooks
  description: The events-mode request Muster sends to outgoing webhook Destinations.
paths:
  /sign-in-options:
    get:
      operationId: getSignInOptions
      tags:
      - Sessions
      summary: Read sign-in options
      description: 'Whether the sign-in page shows the OIDC button next to the local form. Local sign-in is always available;
        no setting turns it off. Carries no version or other detail about the installation.'
      x-permission: none
      x-listener: app
      security: []
      responses:
        '200':
          description: Sign-in options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInOptions'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sessions:
    post:
      operationId: createSession
      tags:
      - Sessions
      summary: Sign in with a local account
      description: Creates a session cookie (`HttpOnly; Secure; SameSite=Lax`) and returns the CSRF token. If the user has
        TOTP and the request carries neither `totp_code` nor `recovery_code`, the session starts in the state `totp_required`
        and `POST /sessions/current/totp` completes it. Under a TOTP policy that covers a user without TOTP the state is `totp_enrolment_required`.
        A wrong login, password or code is `401` (`invalid_credentials`) without saying which one was wrong. Failed attempts
        slow down per account and per source address (`429` with `Retry-After`). A request a browser marks as cross-site
        (`Sec-Fetch-Site` set to `cross-site`) is refused with `403` (`csrf_invalid`).
      x-permission: none
      x-listener: app
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sessions/current:
    get:
      operationId: getCurrentSession
      tags:
      - Sessions
      summary: Read the current session
      description: Returns the session in any state, including the CSRF token the SPA sends on mutating requests.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteCurrentSession
      tags:
      - Sessions
      summary: Sign out
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Ends the session, in any state.
  /sessions/current/totp:
    post:
      operationId: submitSessionTotp
      tags:
      - Sessions
      summary: Give the second factor
      description: Completes a session in the state `totp_required` with a current TOTP code or a single-use recovery code;
        works the same after a local and an OIDC sign-in. A wrong code is `401` (`invalid_credentials`) and slows down like
        a wrong password; `409` (`totp_not_pending`) when the session is not waiting for a code.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTotp'
      responses:
        '200':
          description: The session, now `active` (or `totp_enrolment_required` if the policy still demands enrolment).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sessions/oidc/start:
    get:
      operationId: startOidcSignIn
      tags:
      - Sessions
      summary: Start OIDC sign-in
      description: Redirects the browser to the identity provider with PKCE (`S256`), `state` and `nonce`, all mandatory,
        requesting `offline_access` besides the configured scopes; when the IdP grants it, the offline token is stored on
        the user, encrypted, replacing the previous one.
        Muster exchanges the code itself through the back channel. The redirect URI to register at the identity provider is
        `MUSTER_PUBLIC_URL/api/v1/sessions/oidc/callback`. `409` (`oidc_not_enabled`) while OIDC is off.
      x-permission: none
      x-listener: app
      security: []
      parameters:
      - name: return_to
        in: query
        description: 'Path to open after sign-in: a relative path that starts with a single `/` (never `//`, `/\` or a
          scheme), at most 2000 characters. Anything else is ignored, not refused, so the flow is no open redirect.'
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sessions/oidc/callback:
    get:
      operationId: completeOidcSignIn
      tags:
      - Sessions
      summary: Complete OIDC sign-in
      description: Redirect target of the identity provider. Every outcome is a `302` to the SPA, so the browser never shows
        a raw error. On success it sets the session cookie (state `active`, or `totp_required` when the user has TOTP and
        the identity provider did not assert multi-factor authentication) and redirects to the `return_to` of the start or
        to `/`. The first sign-in of a new identity creates the user, with the login taken from `preferred_username`, else
        the email, else `sub`. Accounts are never merged by login or email; an identity reaches an existing account only by
        linking it from that account's profile (`startOidcLink`). A failure redirects to `/sign-in?error=<code>` with one of
        `no_access` (the person is in no mapped group; the Audit log records the groups from the claim), `login_taken` (a
        new identity's login belongs to an existing account; the page says "An account with this login already exists.
        Sign in with it and link OIDC in your profile.", and the Audit log records the refusal), `account_disabled`,
        `oidc_disabled`, `invalid_request` (bad or missing `state`, `code` or `nonce`) and `idp_error` (the identity
        provider or the back channel failed).
      x-permission: none
      x-listener: app
      security: []
      parameters:
      - name: code
        in: query
        description: Authorization code.
        schema:
          type: string
      - name: state
        in: query
        description: State issued by `startOidcSignIn`.
        schema:
          type: string
      - name: error
        in: query
        description: Error reported by the identity provider.
        schema:
          type: string
      responses:
        '302':
          description: 'Redirect to the SPA: the page to open, or the sign-in page with `error`.'
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /password-setups:
    post:
      operationId: completePasswordSetup
      tags:
      - Sessions
      summary: Set a password from a setup link
      description: Uses the single-use token of a password setup link (the link carries it in the URL fragment, so it reaches
        neither server logs nor referrers). The user is then asked to enrol TOTP if the policy requires it. An unknown token
        is `404`; a token past `auth.password_setup_link_ttl` is `410` (`link_expired`); one already used or replaced by a
        newer link is `410` (`link_used`). Like the sign-in, a request that a browser marks as cross-site is `403`
        (`csrf_invalid`).
      x-permission: none
      x-listener: app
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetup'
      responses:
        '204':
          description: The password was set.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me:
    get:
      operationId: getMe
      tags:
      - Profile
      summary: Read own profile
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
      - apiToken: []
      responses:
        '200':
          description: The caller and effective Permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: The caller and the effective Permissions, narrowed by the token if one is used. Service account tokens
        get `403` (`service_account_not_allowed`).
    put:
      operationId: updateMe
      tags:
      - Profile
      summary: Update own profile
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Changes name, time zone and language. Web session only.
  /me/password:
    put:
      operationId: changePassword
      tags:
      - Profile
      summary: Change own password
      description: Ends all other sessions of the user. Local users only (`409` `local_user_only` otherwise). Web session
        only.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: The password was changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/oidc-identity:
    post:
      operationId: startOidcLink
      tags:
      - Profile
      summary: Start linking an OIDC identity
      description: 'Starts linking the caller''s account to an identity at the OIDC provider: returns the authorization URL
        (PKCE `S256`, `state` and `nonce`) that the SPA opens after warning "After linking you will sign in only through
        OIDC; your password will be removed." The `state` is bound to this web session, so the callback adds the identity
        only to the account that started the link. A successful link removes the password: the account then signs in only
        through OIDC, keeps its TOTP enrolment, and `oidc.sync_role` applies to it. There is no unlinking by the user; an
        Admin can convert the account back to local (`convertUserToLocal`). Web session only: a token gets `403`
        (`session_required`). `409` with `oidc_not_enabled` while OIDC is off, or `oidc_already_linked` when the account
        already signs in through OIDC.'
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      responses:
        '201':
          description: The authorization URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcLinkStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/oidc-identity/callback:
    get:
      operationId: completeOidcLink
      tags:
      - Profile
      summary: Complete linking an OIDC identity
      description: Redirect target of the identity provider for a link started by `startOidcLink`; register
        `MUSTER_PUBLIC_URL/api/v1/me/oidc-identity/callback` at the identity provider next to the sign-in callback. Every
        outcome is a `302` to the profile page. On success the identity (issuer and subject) is added to the account of the
        web session that started the link and the password is removed; an offline token granted by the link flow is kept
        on the user, as at sign-in; this session continues as an OIDC session, the user's other sessions end, and the Audit
        log records it; the redirect goes to `/profile`. A failure
        redirects to `/profile?error=<code>`, with one of `identity_linked_elsewhere` (the identity belongs to another user;
        the Audit log records the refusal), `no_access` (the identity's groups map to no Role and there is no Role for
        unmatched users, so the account could not sign in through OIDC; the redirect is `/profile?error=no_access` and
        the Audit log records the refusal with the groups), `oidc_disabled`, `invalid_request` (bad or missing `state`, `code` or `nonce`, no
        web session, or a `state` started by another session) and `idp_error`.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
      parameters:
      - name: code
        in: query
        description: Authorization code.
        schema:
          type: string
      - name: state
        in: query
        description: State issued by `startOidcLink`.
        schema:
          type: string
      - name: error
        in: query
        description: Error reported by the identity provider.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to `/profile`, or to `/profile?error=<code>` after a failure.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/sessions:
    get:
      operationId: listMySessions
      tags:
      - Profile
      summary: List own sessions
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Sessions of the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Sessions of the user, the current one marked.
    delete:
      operationId: deleteMySessions
      tags:
      - Profile
      summary: Sign out everywhere
      description: Ends every session of the user, the current one included. Web session only.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      responses:
        '204':
          description: All sessions ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/totp:
    get:
      operationId: getMyTotp
      tags:
      - Profile
      summary: Read own TOTP status
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
      - apiToken: []
      responses:
        '200':
          description: TOTP status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Whether TOTP is enrolled, a first code is awaited, and how many recovery codes remain. Service account
        tokens get `403` (`service_account_not_allowed`).
    post:
      operationId: beginTotpEnrolment
      tags:
      - Profile
      summary: Begin TOTP enrolment
      description: Returns the seed and the `otpauth` URI once. Enrolment completes when `confirmTotpEnrolment` receives a
        first code. Allowed in the session state `totp_enrolment_required`. `409` (`totp_already_enrolled`) when TOTP is already
        on. Web session only.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      responses:
        '201':
          description: Enrolment started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/totp/removal:
    post:
      operationId: removeTotp
      tags:
      - Profile
      summary: Remove own TOTP
      description: 'Needs proof that the person is at the keyboard: the current password (local users) or a current TOTP or
        recovery code. Under a TOTP policy that covers the user, the next sign-in demands enrolment again. A wrong proof is
        `401` (`invalid_credentials`). Web session only.'
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpRemoval'
      responses:
        '204':
          description: TOTP removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/totp/confirmation:
    post:
      operationId: confirmTotpEnrolment
      tags:
      - Profile
      summary: Confirm TOTP enrolment
      description: Confirms with a first code and issues `auth.totp_recovery_codes` single-use recovery codes, shown once.
        Allowed in the session state `totp_enrolment_required`. `409` (`totp_enrolment_not_started`) without a begun enrolment,
        `totp_already_enrolled` if already confirmed. Web session only.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: Enrolled; the recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpRecoveryCodes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/totp/recovery-codes:
    post:
      operationId: regenerateTotpRecoveryCodes
      tags:
      - Profile
      summary: Regenerate recovery codes
      description: Invalidates the previous codes. Requires a current TOTP code. Web session only.
      x-permission: authenticated
      x-listener: app
      security:
      - sessionCookie: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: New recovery codes, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpRecoveryCodes'
