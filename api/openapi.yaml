        required:
        - client_secret_status
        - proxy
        - warnings
        - etag
        properties:
          client_secret_status:
            $ref: '#/components/schemas/SecretStatus'
          proxy:
            $ref: '#/components/schemas/ProxyConfig'
          warnings:
            type: array
            items:
              $ref: '#/components/schemas/OidcWarning'
          updated_at:
            type:
            - string
            - 'null'
            format: date-time
          etag:
            type: string
            readOnly: true
            description: The same value as the `ETag` header; send it as `If-Match` on the next update. Lets a client update
              an item of a list without reading it again.
    OidcSettingsInput:
      allOf:
      - $ref: '#/components/schemas/OidcSettingsBase'
      - type: object
        required:
        - proxy
        properties:
          client_secret:
            type: string
            format: password
            writeOnly: true
            description: Write-only Secret. Omit to keep the stored one.
          proxy:
            $ref: '#/components/schemas/ProxyConfigInput'
    OidcCheckResult:
      type: object
      required:
      - ok
      - via
      properties:
        ok:
          type: boolean
        via:
          $ref: '#/components/schemas/ConnectionPath'
        latency_ms:
          type: integer
        issuer:
          type:
          - string
          - 'null'
        authorization_endpoint:
          type:
          - string
          - 'null'
        token_endpoint:
          type:
          - string
          - 'null'
        jwks_uri:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
          description: What failed; names the blocking rule when the outbound address policy refused the target. Secrets and
            tokens are masked.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/OidcWarning'
    ConnectionPath:
      type: string
      description: How the request travelled.
      enum:
      - direct
      - proxy
    AuditActor:
      type: object
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          enum:
          - user
          - service_account
          - system
          - bootstrap
          - cli
        id:
          $ref: '#/components/schemas/NullablePublicId'
        name:
          type: string
          description: Current name; `deleted-user-<id>` for deleted users.
    AuditDiffEntry:
      type: object
      description: One changed field. For Secrets only `secret_changed` is true and no values are present.
      required:
      - pointer
      properties:
        pointer:
          type: string
        before:
          description: Previous value; any JSON type.
        after:
          description: New value; any JSON type.
        secret_changed:
          type: boolean
    AuditEntry:
      type: object
      required:
      - id
      - at
      - actor
      - action
      - transport
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        token_id:
          $ref: '#/components/schemas/NullablePublicId'
        token_name:
          type:
          - string
          - 'null'
        transport:
          $ref: '#/components/schemas/Transport'
        action:
          type: string
          description: Stable action type such as `integration.update`, `alert_group.acknowledge`, `alert_group.takeover`,
            `auth.sign_in`, `auth.sign_in_refused`, `token.issue`, `account_link.link_rejected`.
        resource_type:
          type:
          - string
          - 'null'
        resource_id:
          type:
          - string
          - 'null'
        resource_name:
          type:
          - string
          - 'null'
        diff:
          type: array
          items:
            $ref: '#/components/schemas/AuditDiffEntry'
        details:
          type: object
          description: Action-specific context, for example the groups a refused OIDC sign-in carried. Never contains Secrets.
          additionalProperties: true
    AuditEntryList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type:
          - string
          - 'null'
    TotpPolicy:
      type: string
      description: Who must enrol TOTP. `local_users` covers every account that has a password; an account that signs in
        through OIDC — created through OIDC or linked — is not one. A user has one TOTP enrolment, asked at every
        sign-in and kept when the account changes its sign-in method; on an OIDC sign-in `oidc.skip_totp_with_idp_mfa`
        may skip it.
      enum:
      - nobody
      - local_users
      - everyone
    SeverityMappingEntry:
      type: object
      required:
      - value
      - level
      properties:
        value:
          type: string
        level:
          $ref: '#/components/schemas/SeverityLevel'
    SeverityLevelStyle:
      type: object
      required:
      - level
      - emoji
      - color
      properties:
        level:
          $ref: '#/components/schemas/SeverityLevel'
        emoji:
          type: string
        color:
          type: string
          description: CSS hex colour, for example `#d32f2f`.
    RetentionSettings:
      type: object
      description: 'Retention periods in days. `alert_group_summaries_days` must be at least `alert_details_days`: details
        are always removed before the summary rows they belong to, and an update that breaks this gets `422` with
        `retention_order`. Details are the Alerts inside Alert Groups, Timeline entries and delivery events; Notes are not
        details: they are kept with the summary rows and deleted with them.'
      required:
      - stored_snapshots_days
      - alert_details_days
      - alert_group_summaries_days
      - audit_log_days
      properties:
        stored_snapshots_days:
          type: integer
          minimum: 1
        alert_details_days:
          type: integer
          minimum: 1
          description: Alerts inside Alert Groups, Timeline entries and delivery events (`retention.alert_details`). Never
            Notes.
        alert_group_summaries_days:
          type: integer
          minimum: 1
          description: Alert Group summary rows with their Notes (`retention.alert_group_summaries`); at least
            `alert_details_days`.
        audit_log_days:
          type: integer
          minimum: 1
    OrganizationBase:
      type: object
      required:
      - name
      - time_zone
      - severity_label
      - severity_mapping
      - severity_styles
      - critical_is_urgent
      - instance_labels
      - retention
      - totp_required
      - oidc_token_grace_seconds
      properties:
        name:
          type: string
          minLength: 1
        time_zone:
          type: string
          description: IANA time zone used for times in messages.
        severity_label:
          type: string
          description: Label that carries severity.
        severity_mapping:
          type: array
          description: Values of the severity label mapped to Severity levels. Unmapped values count as warning.
          items:
            $ref: '#/components/schemas/SeverityMappingEntry'
        severity_styles:
          type: array
          items:
            $ref: '#/components/schemas/SeverityLevelStyle'
        critical_is_urgent:
