          minLength: 1
        bot_api_base_url:
          type: string
          format: uri
          description: 'Absolute http(s) URL without query, fragment or user information; a path prefix is allowed. Requests
            go to `<base>/bot<token>/<method>`. A self-hosted Bot API server keeps the bot on that server only: never call
            api.telegram.org with this token from anywhere else.'
