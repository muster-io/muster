# Muster with its PostgreSQL. Copy .env.example to .env next to this file and replace its placeholders first.
name: muster

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: muster
      POSTGRES_DB: muster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Sized for evaluation and small installations, checked with 50,000 to 100,000 Alert Groups under light load and
    # through an upgrade with migrations at about 65,000: about 55 MiB of shared memory (shared_buffers and the rest),
    # plus 30 connections of about 16 MiB each (a connection's cached plans grow over the hour it lives), plus 3
    # autovacuum workers of about 35 MiB each (maintenance_work_mem, or the rows ANALYZE samples), plus about 35 MiB
    # for the other processes and the kernel: about 675 MiB of the 768 MiB limit. The nightly load test fails when the
    # kernel kills a PostgreSQL process.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - muster
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  muster:
    # MUSTER_IMAGE replaces the image, such as a local build.
    image: ${MUSTER_IMAGE:-ghcr.io/muster-io/muster:v0.1.4} # x-release-please-version
    environment:
      # The server migrates on start, and one port serves the app and ingestion.
      MUSTER_MIGRATE_ON_START: "true"
      MUSTER_LISTEN_APP: ":8080"
      MUSTER_LISTEN_INGEST: ":8080"
      MUSTER_DATABASE_HOST: postgres
      MUSTER_DATABASE_NAME: muster
      MUSTER_DATABASE_USER: muster
      MUSTER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      MUSTER_DATABASE_SSLMODE: disable
      MUSTER_SECRET_KEYS: ${MUSTER_SECRET_KEYS}
      MUSTER_PUBLIC_URL: ${MUSTER_PUBLIC_URL}
      MUSTER_BOOTSTRAP_ADMIN_EMAIL: ${MUSTER_BOOTSTRAP_ADMIN_EMAIL}
      MUSTER_BOOTSTRAP_ADMIN_PASSWORD: ${MUSTER_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
