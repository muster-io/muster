{{- $configMap := printf "%s-dashboard" (include "muster.fullname" .) }}
{{- if and .Values.dashboard.grafanaDashboard.enabled (not .Values.dashboard.configMap.enabled) }}
{{- fail "dashboard.grafanaDashboard.enabled needs dashboard.configMap.enabled: the GrafanaDashboard imports the dashboard from that ConfigMap" }}
{{- end }}
{{- if .Values.dashboard.configMap.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMap }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
    {{- with .Values.dashboard.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  muster.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
{{- if .Values.dashboard.grafanaDashboard.enabled }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "muster.fullname" . }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
spec:
  instanceSelector:
    {{- toYaml .Values.dashboard.grafanaDashboard.instanceSelector | nindent 4 }}
  configMapRef:
    name: {{ $configMap }}
    key: muster.json
  {{- with .Values.dashboard.grafanaDashboard.folder }}
  folder: {{ . | quote }}
  {{- end }}
  {{- if .Values.dashboard.grafanaDashboard.allowCrossNamespaceImport }}
  allowCrossNamespaceImport: true
  {{- end }}
{{- end }}
