{{- /* Each item of extraObjects is a document of its own: a map, or a string that holds a YAML manifest, both rendered
through tpl with the root context, so that a manifest can name .Values and .Release. */ -}}
{{- range .Values.extraObjects }}
---
{{ if typeIs "string" . }}{{ tpl . $ }}{{ else }}{{ tpl (toYaml .) $ }}{{ end }}
{{- end }}
