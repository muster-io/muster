  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Documentation
      url: https://muster-io.github.io/muster/
    - name: Install with Helm
      url: https://muster-io.github.io/muster/latest/install/helm/
    - name: Source
      url: https://github.com/muster-io/muster
    - name: support
      url: https://github.com/muster-io/muster/issues
