apiVersion: v2
name: muster
description: Self-hosted alert grouping and on-call service
type: application
version: 0.0.1
appVersion: "0.0.0-dev"
home: https://github.com/muster-io/muster
icon: https://raw.githubusercontent.com/muster-io/muster/master/docs/brand/muster-mark-tile.svg
sources:
  - https://github.com/muster-io/muster
keywords:
  - alerting
  - alertmanager
  - on-call
  - incident-response
  - mattermost
  - telegram
  - slack
maintainers:
  - name: Muster Authors
    url: https://github.com/muster-io
kubeVersion: ">=1.30.0-0"
