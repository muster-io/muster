# The database URL from the app Secret that CloudNativePG generates for the Cluster muster-db; the master keys and the
# bootstrap Admin password stay in existingSecret.
existingSecret: muster

database:
  existingSecret: muster-db-app
  urlKey: uri

publicURL: https://muster.example.org

bootstrapAdmin:
  email: admin@example.org
  passwordKey: bootstrap-password
