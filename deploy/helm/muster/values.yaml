global:
  # Replaces image.registry when set, for every image the chart renders.
  imageRegistry: ""

image:
  # The registry host. global.imageRegistry wins over it. Point it at a pull-through proxy to pull the image through it.
  registry: ghcr.io
  # The path of the image in the registry. A value that starts with a registry host (a first path segment with a "." or
  # ":", or localhost), such as ghcr.io/muster-io/muster, is used as it is, with neither registry applied.
  repository: muster-io/muster
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicas: 1

existingSecret: ""
masterKeysKey: secret-keys

database:
  host: ""
  port: 5432
  name: muster
  user: muster
  sslmode: ""
  existingSecret: ""
  passwordKey: database-password
  urlKey: ""
  sessionHost: ""
  sessionPort: null

publicURL: ""
ingestURL: ""

bootstrapAdmin:
  email: ""
  passwordKey: ""

extraEnv: []

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  app:
    type: ClusterIP
    port: 8080
    annotations: {}
  ingest:
    type: ClusterIP
    port: 8081
    annotations: {}
  internal:
    type: ClusterIP
    port: 8082
    annotations: {}

ingress:
  enabled: false
  className: ""
  # Annotations of both Ingresses. app.annotations and ingest.annotations are merged over a copy of it for their own
  # Ingress, and their keys win.
  annotations: {}
  app:
    annotations: {}
    hosts: []
    tls: []
  ingest:
    annotations: {}
    hosts: []
    tls: []

httpRoute:
  enabled: false
  parentRefs: []
  # Annotations of both HTTPRoutes. app.annotations and ingest.annotations are merged over a copy of it for their own
  # HTTPRoute, and their keys win.
  annotations: {}
  labels: {}
  app:
    annotations: {}
    hostnames: []
  ingest:
    annotations: {}
    hostnames: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

alerting:
  runbookBaseURL: https://muster-io.github.io/muster
  jobSelector: ""
  prometheusRule:
    enabled: false
    labels: {}
  vmRule:
    enabled: false
    labels: {}
  rules:
    MusterDown:
      enabled: true
      for: 2m
    MusterNoLeader:
      enabled: true
      for: 2m
    MusterDeliveryFailing:
      enabled: true
      for: 5m
      window: 10m
    MusterDestinationBroken:
      enabled: true
      for: 5m
    MusterHeartbeatLost:
      enabled: true
      for: 1m
    MusterDeliverySlow:
      enabled: true
      for: 15m
      seconds: 5
      window: 15m
    MusterDeliveryQueueGrowing:
      enabled: true
      for: 15m
      size: 100
      window: 15m
    MusterIngestBacklog:
      enabled: true
      for: 5m
      backlog: 1000
      delaySeconds: 60
      window: 5m
    MusterIngestRejected:
      enabled: true
      for: 0m
      unauthorized: 10
      window: 15m
    MusterTemplateError:
      enabled: true
      for: 0m
      window: 15m
    MusterClockSkew:
      enabled: true
      for: 5m
      seconds: 2
    MusterLoginFailures:
      enabled: true
      for: 0m
      failures: 20
      window: 10m

dashboard:
  configMap:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}
  grafanaDashboard:
    enabled: false
    instanceSelector:
      matchLabels:
        dashboards: grafana
    folder: ""
    allowCrossNamespaceImport: false

extraObjects: []
